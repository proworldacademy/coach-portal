<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>PROWORLD</title>
<link rel="icon" href="data:,">
<script>if (location.hostname === "proworldacademy.github.io") location.replace("https://proworld-coach-portal.web.app/p" + location.search + location.hash);</script>
<link rel="stylesheet" href="/shared/brand.css">
<link rel="stylesheet" href="/shared/design.css">
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="/shared/pages.js"></script>
<script src="/shared/pwauth.js"></script>
<script src="/shared/design.js"></script>
<style>
/* PROWORLD — the page viewer in the redesign (C4 · Round 2, skin "studio"): the team's reports, plans and prototypes, opened
   on this site with the PROWORLD sign-in. Each page is a locked file (p/data/<file>.bin); its key comes from the database
   only for someone who holds the page. The chrome is the design's (top bar, a slim title line, the page in a glass frame);
   the page itself runs untouched in a sandboxed frame. */
html,body{height:100%}
body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;overflow:hidden}
.wrap{max-width:none;width:100%;flex:1;min-height:0;display:flex;flex-direction:column;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.pv-line{display:flex;align-items:center;gap:12px;padding:2px 2px 12px;min-width:0;flex:none}
.pv-line h1{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:clamp(26px,3.4vw,40px);line-height:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pv-line .sp{flex:1}
.pv-line .who{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pv-line .pill.proto{background:var(--cyan)}.pv-line .pill.plan{background:var(--orchid)}.pv-line .pill.report,.pv-line .pill.page{background:var(--mint)}.pv-line .pill.archive{background:transparent;border:1px solid var(--line-2);color:var(--muted)}
#pv{flex:1 1 auto;width:100%;min-height:0;border:1px solid var(--line);border-radius:18px;background:#fff;display:block;box-shadow:0 14px 34px -22px rgba(0,0,0,.28)}
#pv[hidden]{display:none}
.pv-msg{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.pv-msg[hidden]{display:none}
.pv-msg .card{width:100%;max-width:520px;padding:28px 30px;background:var(--card-2)}
.pv-msg h1{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:40px;line-height:.92;margin:0 0 12px}
.pv-msg h1 em{font-style:inherit;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.pv-msg p{color:var(--ink-2);font-size:14px;line-height:1.55;margin:0 0 12px}
.pv-msg a{color:var(--ink);font-weight:700;text-decoration:underline;text-decoration-color:var(--lime);text-decoration-thickness:2px;text-underline-offset:3px}
.spin{width:16px;height:16px;border:2px solid rgba(0,0,0,.15);border-top-color:var(--ink);border-radius:50%;animation:pvspin .8s linear infinite;display:inline-block;vertical-align:-3px;margin-right:8px}
@keyframes pvspin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
@media(max-width:640px){.pv-line .who{display:none}.pv-line{padding-bottom:8px}}
</style>
</head>
<body class="skin-studio sky-short">
<div class="wrap">
  <div class="pwd-top" id="pwd-top"></div>
  <div class="pv-line"><h1 id="nm">PROWORLD</h1><span class="pill" id="st" hidden></span><span class="sp"></span><span class="who" id="who"></span></div>
  <div class="pv-msg" id="msg"><div class="card"><h1>One <em>moment</em></h1><p><span class="spin"></span>Opening the page…</p></div></div>
  <iframe id="pv" title="PROWORLD page" hidden sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox allow-downloads allow-forms allow-modals" referrerpolicy="no-referrer"></iframe>
</div>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const P = window.PW_PAGES || { PAGES: [], STATUS_LABEL: {} };
  const id = new URLSearchParams(location.search).get("id") || "";
  const page = (P.PAGES || []).find((p) => p.id === id && p.file);
  window.PWDesign.mount({ skin: "studio", active: id || "/p", title: page ? page.name : "PROWORLD" });
  function show(title, html, state) {
    $("pv").hidden = true; $("pv").removeAttribute("srcdoc");
    const m = $("msg"); m.hidden = false; m.innerHTML = '<div class="card"><h1>' + title + "</h1>" + html + "</div>";
    document.body.setAttribute("data-pv", state || "msg");
  }
  if (!page) { show("Page <em>not found</em>", "<p>There is no page called “" + esc(id) + "” on the PROWORLD site.</p><p><a href=\"/\">Open the Dashboard →</a></p>", "missing"); return; }
  document.title = page.name + " · PROWORLD";
  $("nm").textContent = page.name; $("who").textContent = page.owner || "";
  const st = $("st"); st.textContent = (P.STATUS_LABEL || {})[page.status] || page.status || ""; st.className = "pill " + (page.status || ""); st.hidden = !st.textContent;

  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  // The page runs in a sandbox with no access to this site or your sign-in. "about:srcdoc" as its base keeps its own
  // links (#sections, its views) inside the page; a view name (the backend's #owner, #desk…) is set before it starts.
  function frameDoc(html, hash) {
    const pre = '<base href="about:srcdoc">' + (hash ? "<script>try{if(location.hash!==\"#" + hash + "\")location.hash=\"" + hash + "\"}catch(e){}<\/script>" : "");
    const m = html.match(/<head(\s[^>]*)?>/i);
    return m ? html.slice(0, m.index + m[0].length) + pre + html.slice(m.index + m[0].length) : pre + html;
  }
  async function open() {
    let key = null;
    try { const d = await PWAuth.fs().doc("pageKeys/" + id).get(); key = d.exists ? d.data() : null; }
    catch (e) { show("Can't <em>open</em> it", "<p>The database didn't hand over this page (" + esc((e && (e.code || e.message)) || "refused") + "). If it should be yours, ask an administrator to tick it for you on the Dashboard.</p>", "refused"); return; }
    if (!key || !key.k || !key.f) { show("Not <em>ready</em> yet", "<p>This page is on the site but hasn't been unlocked yet — an owner does that once. Try again later.</p><p><a href=\"/\">Back to the Dashboard →</a></p>", "nokey"); return; }
    if (typeof DecompressionStream === "undefined" || !(window.crypto && crypto.subtle)) { show("Update your <em>browser</em>", "<p>This page needs a current Chrome, Safari, Edge or Firefox.</p>", "oldbrowser"); return; }
    try {
      const r = await fetch("/p/data/" + encodeURIComponent(key.f) + ".bin", { cache: "no-cache" });
      if (!r.ok) throw new Error("the file answered " + r.status);
      const buf = new Uint8Array(await r.arrayBuffer());
      const k = await crypto.subtle.importKey("raw", b64(key.k), "AES-GCM", false, ["decrypt"]);
      const gz = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12), additionalData: new TextEncoder().encode("proworld-page:" + key.f) }, k, buf.slice(12));
      const html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
      const f = $("pv");
      f.onload = () => document.body.setAttribute("data-pv", "ok");
      f.title = page.name;
      f.srcdoc = frameDoc(html, page.hash || "");
      $("msg").hidden = true; f.hidden = false;
      document.body.setAttribute("data-pv-bytes", String(html.length));
    } catch (e) {
      show("Can't <em>open</em> it", "<p>The page didn't unlock (" + esc((e && (e.message || e.name)) || "unknown") + "). Reload the page; if it keeps happening, tell an owner.</p>", "error");
    }
  }
  PWAuth.start({ need: id }).then(open);
})();
</script>
</body>
</html>
