.lead{margin-top:18px;font-size:17px;color:var(--ink-2);max-width:54ch;animation:pwd-up .9s .25s var(--ease) both}

/* candidate for design.css: a light table */

.scroll{overflow-x:auto}
.form .field{min-width:0}

<body class="skin-family sky-short">
<div class="wrap">
  <div class="pwd-top" id="pwd-top"></div>
  <main id="app"><div class="gate"><div class="card"><p class="hint"><span class="spin"></span>&nbsp; One moment…</p></div></div></main>
</div>
<script src="/shared/design.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script>
(function(){
'use strict';
/* The family portal. Nothing here reads the database: every fact comes from /api/family/* with the parent's sign-in token,
   and the engine answers only with that family's own players, attendance, reports, bills and requests. */
const CFG={apiKey:"AIzaSyBauu-JZZKCzex-PpTjBpD4QuTSWIkVEs4",authDomain:"proworld-coach-portal.web.app",projectId:"proworld-coach-portal",appId:"1:999676464496:web:fa726be60d8da0112393b5"};
const EMAIL_KEY='pw-family-email';
/* View as a client (Nov 16, 2026): an owner who chose a family in "View as" sees that family's account here, read by the engine with the
   owner's own sign-in (X-View-Family carries the player's id; the engine answers it for owners only, and only the reading route). */
const VIEW=(()=>{try{const v=JSON.parse(localStorage.getItem('pw-view-as')||'null');return v&&v.kind==='client'&&v.pid&&v.until>Date.now()?v:null}catch(e){return null}})();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cents=c=>'$'+((c||0)/100).toLocaleString('en-US',{minimumFractionDigits:c%100?2:0,maximumFractionDigits:2});
const dollars=d=>'$'+Number(d||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];const DOWS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const nice=d=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(d||''))return d||'';const [y,m,dd]=d.split('-').map(Number);const dt=new Date(Date.UTC(y,m-1,dd));return DOWS[dt.getUTCDay()]+', '+MONTHS[m-1]+' '+dd+(y!==new Date().getFullYear()?', '+y:'')};
const short=d=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(d||''))return d||'';const [y,m,dd]=d.split('-').map(Number);return MONTHS[m-1]+' '+dd};
const app=document.getElementById('app');
let auth=null,me=null,busy=false,toastT=null;
const G='<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.8-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.4 2.3-6.2 0-11.5-4.2-13.4-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>';
/* the design's frame: the wordmark alone at the top (no team pages, no jump field) and a spot for "signed in as" */
window.PWDesign.mount({skin:'family',strip:false,jump:false,title:'Family portal'});
const topline=document.createElement('div');topline.id='topline';document.getElementById('pwd-top').appendChild(topline);
function toast(msg,err){clearTimeout(toastT);let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.className='toast show'+(err?' err':'');t.textContent=msg;toastT=setTimeout(()=>{t.className='toast'},err?6000:3500)}
function footer(){return `<footer class="pwd-foot"><b>PROWORLD</b><span>Individually built. Fully connected.</span><span>651 Egret Cir, Delray Beach, FL 33444</span><a href="sms:+15614030008">Text the front desk · (561) 403-0008</a><a href="/enroll">Enroll a player</a><a href="/enroll/agreement">Program policies</a></footer>`}
function touch(){return matchMedia('(pointer:coarse)').matches}
/* the outlined word of a title: "Hi, Maria." → the name white with the black stroke */
const title=(before,em)=>`<section class="hero one greet"><h1><span>${before}</span> <span><em>${em}</em></span></h1></section>`;

/* ── sign-in: six digits by e-mail (Nov 14, 2026) — the one that works inside the App Store app; Google stays on the web ── */
const INAPP=!!window.Capacitor;
async function pub(path,body){const r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.message||'Something went wrong. Try again.');e.status=r.status;throw e}return j}
function gate(state,extra){
  topline.innerHTML='';{const b=document.querySelector('.pw-coachbar');if(b){b.remove();document.body.classList.remove('has-coachbar')}}
  const err=extra&&extra.err?`<p class="fine bad">${esc(extra.err)}</p>`:'';
  if(state==='code'){app.innerHTML=`<div class="gate">${title('Check your','e-mail.')}<p class="lead">If <b>${esc(extra.email)}</b> is on file, six digits are on their way. Type them here.</p><div class="card"><form id="codef"><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]*" maxlength="7" placeholder="000 000" required style="font:800 28px/1.2 inherit;letter-spacing:.18em;text-align:center"><button class="btn lime" type="submit" id="codego">Sign in <span class="ar">→</span></button></form>${err}<p class="fine">The code works once, for ten minutes. Nothing in your inbox? Look in spam, or check the address.</p><div class="rowx"><button class="btn ghost" id="resend">Send a new code</button><button class="btn ghost" id="again">Use a different e-mail</button></div></div></div>${footer()}`;
    const inp=document.getElementById('code');inp.focus();
    document.getElementById('codef').onsubmit=async(e)=>{e.preventDefault();const code=inp.value.replace(/\D/g,'');if(code.length!==6){gate('code',{email:extra.email,err:'Type the six digits from the e-mail.'});return}const go=document.getElementById('codego');go.disabled=true;go.textContent='Signing in…';
      try{const r=await pub('family/code/verify',{email:extra.email,code});await auth.signInWithEmailAndPassword(extra.email,r.pass);localStorage.removeItem(EMAIL_KEY)}catch(x){gate('code',{email:extra.email,err:x.message||cleanErr(x)})}};
    document.getElementById('resend').onclick=async()=>{try{await pub('family/code',{email:extra.email});gate('code',{email:extra.email,err:'A new code is on its way.'})}catch(x){gate('code',{email:extra.email,err:x.message})}};
    document.getElementById('again').onclick=()=>{localStorage.removeItem(EMAIL_KEY);gate('in')};return}
  if(state==='sent'){app.innerHTML=`<div class="gate">${title('Check your','e-mail.')}<p class="lead">We sent a sign-in link to <b>${esc(extra.email)}</b>. Open it on this device and you're in. Nothing to remember — no password.</p><div class="card"><button class="btn ghost" id="again">Use a different e-mail</button></div></div>${footer()}`;document.getElementById('again').onclick=()=>{localStorage.removeItem(EMAIL_KEY);gate('in')};return}
  if(state==='ask'){app.innerHTML=`<div class="gate">${title('Almost','there.')}<p class="lead">Confirm the e-mail the link was sent to.</p><div class="card"><form id="confirm"><input type="email" id="em" placeholder="you@example.com" required autocomplete="email"><button class="btn lime" type="submit">Sign in</button></form>${err}</div></div>${footer()}`;document.getElementById('confirm').onsubmit=async(e)=>{e.preventDefault();const email=document.getElementById('em').value.trim().toLowerCase();try{await auth.signInWithEmailLink(email,location.href);localStorage.removeItem(EMAIL_KEY);history.replaceState(null,'',location.pathname)}catch(x){gate('ask',{err:cleanErr(x)})}};return}
  app.innerHTML=`<div class="gate">
    ${title('Your family at','ProWorld.')}
    <p class="lead">Your players, their coaches and schedule, this month's attendance, the reports the coaches send, your bills — and a direct line to the front desk. Sign in with the e-mail you gave us when you enrolled.</p>
    <div class="card">
      <form id="link"><input type="email" id="email" placeholder="you@example.com" required autocomplete="email" inputmode="email" value="${esc((extra&&extra.email)||localStorage.getItem(EMAIL_KEY)||'')}"><button class="btn lime" type="submit" id="codebtn">E-mail me a code <span class="ar">→</span></button></form>
      ${INAPP?'':`<div class="or">or</div><button class="btn" id="google">${G} Continue with Google</button>`}
      ${err}
      <p class="fine"><a href="/?side=team" id="toteam" style="text-decoration:underline">On the ProWorld team? Sign in here →</a></p>
      <p class="fine">No password. We send six digits to your e-mail; type them here and you're in. If your e-mail isn't on file yet, text the front desk at (561) 403-0008 and we'll add it.</p>
    </div></div>${footer()}`;
  if(!INAPP)document.getElementById('google').onclick=async()=>{const prov=new firebase.auth.GoogleAuthProvider();prov.setCustomParameters({prompt:'select_account'});try{if(touch()){await auth.signInWithRedirect(prov);return}await auth.signInWithPopup(prov)}catch(x){gate('in',{err:cleanErr(x)})}};
  document.getElementById('link').onsubmit=async(e)=>{e.preventDefault();const email=document.getElementById('email').value.trim().toLowerCase();if(!email)return;const btn=document.getElementById('codebtn');btn.disabled=true;btn.textContent='Sending…';
    try{await pub('family/code',{email});localStorage.setItem(EMAIL_KEY,email);gate('code',{email})}
    catch(x){
      // the mailbox for codes is not set up yet: on the web the old e-mailed link still works; inside the app it cannot
      if(x.status===503&&!INAPP){try{await auth.sendSignInLinkToEmail(email,{url:location.origin+'/family',handleCodeInApp:true});localStorage.setItem(EMAIL_KEY,email);gate('sent',{email})}catch(y){gate('in',{email,err:cleanErr(y)})}return}
      gate('in',{email,err:x.status===503?'Sign-in codes are being set up. Text the front desk at (561) 403-0008 and we will get you in.':x.message})}};
}
function cleanErr(x){const c=x&&x.code||'';if(c==='auth/operation-not-allowed')return 'E-mail links are not switched on yet — use Google for now, or text the front desk.';if(c==='auth/invalid-email')return 'That e-mail does not look right.';if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request')return '';if(c==='auth/invalid-action-code'||c==='auth/expired-action-code')return 'That link has expired or was already used — ask for a new one.';return (x&&x.message)||'Something went wrong. Try again.'}

/* ── the engine ── */
async function api(path,body){
  const user=auth.currentUser;if(!user)throw new Error('Sign in first.');
  const token=await user.getIdToken();
  const r=await fetch('/api/family/'+path,{method:body?'POST':'GET',headers:Object.assign({Authorization:'Bearer '+token},VIEW?{'X-View-Family':VIEW.pid}:{},body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined,cache:'no-store'});
  const j=await r.json().catch(()=>({error:'bad',message:'The server answered badly.'}));
  if(!r.ok||j.error)throw new Error(j.message||'Something went wrong.');
  return j;
}
async function load(){
  app.innerHTML=`<div class="gate"><div class="card"><p class="hint"><span class="spin"></span>&nbsp; Loading your family…</p></div></div>`;
  try{if(!VIEW)localStorage.setItem('pw-side','family')}catch(e){}
  try{me=await api('me');render()}catch(e){app.innerHTML=`<div class="gate">${title('One','moment.')}<p class="lead">${esc(e.message)}</p><div class="rowx"><button class="btn" id="retry">Try again</button><button class="btn ghost" id="out">Sign out</button></div></div>${footer()}`;document.getElementById('retry').onclick=load;document.getElementById('out').onclick=()=>auth.signOut()}
}

/* ── the page ── */
function statusPills(p){
  const out=[];const en=p.enroll||{};
  if(p.status==='away')out.push('<span class="pill ghost">Away</span>');
  if(p.status==='finished')out.push('<span class="pill ghost">Finished</span>');
  if(en.hold)out.push('<span class="pill lime">On hold'+(en.holdReason==='unpaid'?' · balance due':'')+'</span>');
  if(en.endsOn)out.push(`<span class="pill ghost">Ends ${esc(short(en.endsOn))}</span>`);
  if(en.start&&en.start>me.today)out.push(`<span class="pill cyan">Starts ${esc(short(en.start))}</span>`);
  if(!out.length&&p.status==='active')out.push('<span class="pill mint">Training</span>');
  return out.join('');
}
function playerCard(p){
  const en=p.enroll;const a=p.attendance||{days:[],present:0,missed:0,month:''};
  const plan=en?`${esc(en.programShort||en.programName)}${en.planLabel?' · '+esc(en.planLabel):''}${en.days&&en.days.length?' · '+esc(en.days.join('/')):''}`:'';
  const next=en&&en.next&&en.next.date&&!en.endsOn&&en.status!=='canceled'?`${en.next.cents!=null?cents(en.next.cents):(en.monthly?dollars(en.monthly):'')} on ${esc(nice(en.next.date))}`:'';
  const days=a.days.slice(0,24).map(d=>`<span class="day${d.present?'':' miss'}" title="${d.present?'Attended':'Missed'}">${esc(short(d.date))}</span>`).join('');
  return `<div class="card" id="p-${esc(p.id)}">
    <div class="rowx between"><h3>${esc(p.name)}</h3><div class="rowx">${statusPills(p)}</div></div>
    <div class="hint">${esc(p.groupLabel||'Not in a group yet')}${p.coach?' · Coach '+esc(p.coach):' · coach to be assigned'}${p.coach2?' with '+esc(p.coach2):''}</div>
    <dl class="facts">
      ${plan?`<dt>Program</dt><dd>${plan}${en.start?`<span class="hint"> · since ${esc(short(en.start))}</span>`:''}</dd>`:'<dt>Program</dt><dd class="hint">On the roster — billing not through this account yet.</dd>'}

  const first=(me.name||me.email).split(/[\s@]/)[0];
  topline.innerHTML=me.viewing?'':`<span class="who"><a href="#account" style="color:inherit;text-decoration:none"><span>${esc(me.email)}</span></a><button id="signout" type="button">Sign out</button></span>`;
  if(!me.viewing)document.getElementById('signout').onclick=()=>auth.signOut();
  (function mb(n){if(window.PWMemberBar)window.PWMemberBar();else if(n<25)setTimeout(()=>mb(n+1),200)})(0);   // the member side's bottom bar on a phone (shared/coachbar.js)
  if(!me.known){
    app.innerHTML=`<div class="gate">${title("We don't see you",'yet.')}<p class="lead">Nothing is on file under <b>${esc(me.email)}</b>. If you enrolled with a different e-mail, sign out and use that one. If your player came to us before the new system, text the front desk and we'll link your e-mail in a minute.</p>
      <div class="rowx"><a class="btn lime" href="sms:+15614030008?&body=${encodeURIComponent('Hi — please link my family portal to '+me.email)}">Text the front desk</a><a class="btn ghost" href="/enroll">Enroll a player</a><button class="btn ghost" id="out2">Sign out</button></div></div>${footer()}`;
    document.getElementById('out2').onclick=()=>auth.signOut();return;
  }
  const reports=[];me.players.forEach(p=>p.reports.forEach(r=>reports.push([p,r])));
  reports.sort((a,b)=>String(b[1].date).localeCompare(String(a[1].date)));
  const repSel=reports.filter(([p])=>me.players.filter(x=>x.status!=='finished').length<2||!SEL||p.id===SEL);   // Nov 19: only the player on screen
  const active=me.players.filter(p=>p.status!=='finished');const finished=me.players.filter(p=>p.status==='finished');
  const attended=active.reduce((n,p)=>n+((p.attendance&&p.attendance.present)||0),0);
  app.innerHTML=`
    ${homeC(first,active)}
    <section class="sec" id="players"><div class="sec-h"><h2>${active.length>1&&SEL?esc((active.find(p=>p.id===SEL)||{}).shortName||'Player'):'Players'}</h2><small>${active.length>1?'switch player at the top':'on the roster'}</small></div>
    ${active.filter(p=>active.length<2||!SEL||p.id===SEL).map(playerCard).join('')||'<div class="card"><p class="hint">No active players under this e-mail.</p></div>'}
    ${finished.length?`<details class="past"><summary>Past players (${finished.length})</summary>${finished.map(playerCard).join('')}</details>`:''}
    <div class="rowx"><a class="btn ghost sm" href="/enroll">Enroll another player</a></div></section>
    <section class="sec" id="reports"><div class="sec-h"><h2>Reports</h2><small>from the coaches</small></div>
    ${repSel.length?repSel.map(([p,r])=>reportCard(p,r)).join(''):'<div class="card"><p class="hint">The coaches share reports here after each assessment — the first one appears once it is marked as sent.</p></div>'}</section>
    ${billingBlock()}
    ${requestsBlock()}
    ${footer()}`;
  app.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>{SEL=b.dataset.sel;render()});
  app.querySelectorAll('[data-ask]').forEach(b=>b.onclick=()=>{if(b.dataset.ask==='private'){bkOpen('tennis',CALSEL||me.today);return}const k=document.getElementById('kind'),pl=document.getElementById('player');if(k)k.value=b.dataset.ask;if(pl&&SEL)pl.value=SEL;const sec=document.getElementById('requests');if(sec)sec.scrollIntoView({behavior:'smooth',block:'start'});const tx=document.getElementById('text');if(tx)setTimeout(()=>tx.focus({preventScroll:true}),450)});
  const daysDo=async(body,ok)=>{if(busy)return;busy=true;try{await api('days',Object.assign({player:SEL},body));toast(ok);me=await api('me')}catch(x){toast(x.message,true)}busy=false;render()};
  app.querySelectorAll('[data-absent]').forEach(b=>b.onclick=()=>{if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='Tap again to confirm';setTimeout(()=>{if(b.isConnected&&b.dataset.sure==='1'){b.dataset.sure='';b.textContent='Cannot make it'}},4000);return}b.disabled=true;   // two taps, no pop-up: a phone app's pop-ups are not dependable
    daysDo({action:'away',date:b.dataset.absent},'Told the academy. Thank you.')});
  app.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{b.disabled=true;daysDo({action:'makeup',date:b.dataset.move},'Moved. The academy knows.')});
  app.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{b.disabled=true;daysDo({action:'back',date:b.dataset.back},'Counted in again.')});
  app.querySelectorAll('[data-cal-open]').forEach(b=>b.onclick=()=>{CALOPEN[SEL]=CALOPEN[SEL]===false;CALSEL='';const y=window.scrollY;render();window.scrollTo(0,y)});
  app.querySelectorAll('[data-ses]').forEach(b=>b.onclick=()=>{PICK=PICK||[];const id=b.dataset.ses;PICK=PICK.includes(id)?PICK.filter(x=>x!==id):PICK.concat(id);const y=window.scrollY;render();window.scrollTo(0,y)});
  app.querySelectorAll('[data-people-add]').forEach(b=>b.onclick=()=>{ADDP=true;const y=window.scrollY;render();window.scrollTo(0,y);const n=document.getElementById('ap-name');if(n)n.focus()});
  const peopleDo=async(body,ok)=>{if(busy)return;busy=true;const y=window.scrollY;try{await api('people',Object.assign({player:SEL},body));toast(ok);ADDP=false;me=await api('me')}catch(x){toast(x.message,true)}busy=false;render();window.scrollTo(0,y)};
  const addp=document.getElementById('addp');if(addp)addp.onsubmit=(e)=>{e.preventDefault();peopleDo({name:document.getElementById('ap-name').value,phone:document.getElementById('ap-phone').value},'Added. They get one text to say so.')};
  app.querySelectorAll('[data-people-x]').forEach(b=>b.onclick=()=>peopleDo({remove:b.dataset.peopleX,name:b.dataset.peopleN},'Removed.'));
  app.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{PICK=null;CALSEL=CALSEL===b.dataset.day?'':b.dataset.day;const y=window.scrollY;render();window.scrollTo(0,y)});
  app.querySelectorAll('[data-day-do]').forEach(b=>b.onclick=()=>{const a=b.dataset.dayDo;const d=CALSEL;b.disabled=true;const y=window.scrollY;
    daysDo(a==='book'?{action:a,date:d,sessions:PICK||[]}:{action:a,date:d},a==='book'?((PICK||[]).length?'Booked. The academy knows.':'Taken off.'):a==='away'?'Marked away. The academy knows.':a==='back'?'Counted in again.':a==='makeup'?'Make-up day added.':'Make-up day removed.').then(()=>window.scrollTo(0,y))});
  app.querySelectorAll('[data-mon]').forEach(b=>b.onclick=()=>{const [y0,m0]=CALMON.split('-').map(Number);const d=new Date(y0,m0-1+Number(b.dataset.mon),1,12);CALMON=ymd(d).slice(0,7);CALSEL='';const y=window.scrollY;render();window.scrollTo(0,y)});
  app.querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>bkOpen(b.dataset.book,b.dataset.bookDay));
  app.querySelectorAll('[data-bell]').forEach(b=>b.onclick=()=>bellOn());
  app.querySelectorAll('[data-pv-x]').forEach(b=>b.onclick=()=>twice(b,'',async()=>{if(busy)return;busy=true;const y=window.scrollY;try{await api('private/cancel',{id:b.dataset.pvX});toast('Canceled. The coach and the academy know.');me=await api('me')}catch(x){toast(x.message,true)}busy=false;render();window.scrollTo(0,y)}));
  const accDo=async(body,ok)=>{if(busy)return;busy=true;const y=window.scrollY;try{await api('account',body);toast(ok);ACCADD=false;me=await api('me')}catch(x){toast(x.message,true)}busy=false;render();window.scrollTo(0,y)};
  const keepY=(f)=>{const y=window.scrollY;f();render();window.scrollTo(0,y)};
  app.querySelectorAll('[data-acc-open]').forEach(b=>b.onclick=()=>keepY(()=>{ACCOPEN=!ACCOPEN;ACCED=null;ACCADD=false}));
  document.querySelectorAll('a[href="#account"]').forEach(l=>l.addEventListener('click',()=>{if(!ACCOPEN){ACCOPEN=true;render();setTimeout(()=>{const s=document.getElementById('account');if(s)s.scrollIntoView({behavior:'smooth',block:'start'})},30)}}));
  app.querySelectorAll('[data-acc-ed]').forEach(b=>b.onclick=()=>{keepY(()=>{ACCED=b.dataset.accEd?{k:b.dataset.accEd,tail:b.dataset.tail||''}:null});const i=document.getElementById('ae-name')||document.getElementById('ae-phone');if(i)i.focus({preventScroll:true})});
  const an=document.getElementById('accname');if(an)an.onsubmit=(e)=>{e.preventDefault();ACCED=null;accDo({action:'name',name:document.getElementById('ae-name').value},'Saved. The coaches see it too.')};
  const ap=document.getElementById('accphone');if(ap)ap.onsubmit=(e)=>{e.preventDefault();const t=ap.dataset.tail;ACCED=null;accDo({action:'phone-change',tail:t,phone:document.getElementById('ae-phone').value},'Saved. The new number gets one text to say so.')};
  app.querySelectorAll('[data-acc-add]').forEach(b=>b.onclick=()=>{ACCADD=true;const y=window.scrollY;render();window.scrollTo(0,y);const n=document.getElementById('ac-name');if(n)n.focus({preventScroll:true})});
  const accf=document.getElementById('accadd');if(accf)accf.onsubmit=(e)=>{e.preventDefault();accDo({action:'add',name:document.getElementById('ac-name').value,email:document.getElementById('ac-email').value,phone:document.getElementById('ac-phone').value},'Added to your account.')};
  const twice=(b,label,go)=>{if(b.dataset.sure!=='1'){b.dataset.sure='1';const was=b.textContent;b.textContent='Tap again to confirm';setTimeout(()=>{if(b.isConnected&&b.dataset.sure==='1'){b.dataset.sure='';b.textContent=was}},4000);return}b.disabled=true;go()};
  app.querySelectorAll('[data-acc-xe]').forEach(b=>b.onclick=()=>twice(b,'',()=>accDo({action:'email-remove',email:b.dataset.accXe},'Removed. That e-mail can no longer sign in.')));
  app.querySelectorAll('[data-acc-xp]').forEach(b=>b.onclick=()=>twice(b,'',()=>accDo({action:'phone-remove',tail:b.dataset.accXp},'Removed.')));
  app.querySelectorAll('[data-acc-main]').forEach(b=>b.onclick=()=>twice(b,'',()=>accDo({action:'email-main',email:b.dataset.accMain},'Done. The academy writes to that e-mail now.')));
  app.querySelectorAll('[data-acc-card]').forEach(b=>b.onclick=async()=>{if(busy)return;busy=true;b.disabled=true;try{const o=await api('portal',{});location.href=o.url}catch(e){toast(e.message,true)}busy=false;b.disabled=false});
  app.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>chatOpen(b));
  app.querySelectorAll('[data-renew]').forEach(b=>b.onclick=()=>{const pl=(me.players||[]).find(x=>x.id===b.dataset.renew);if(!pl||!pl.renew)return;const r=pl.renew;const w=String(pl.name||'').trim().split(/\s+/);
    try{sessionStorage.setItem('pw-renew',JSON.stringify({first:w[0]||'',last:w.slice(1).join(' '),parent:me.name||'',email:me.email||'',at:Date.now()}))}catch(x){/* the form is filled in by hand */}
    location.href='/enroll?switch=1&p='+encodeURIComponent(r.program)+'&plan='+encodeURIComponent(r.plan)+(r.days&&r.days.length?'&days='+encodeURIComponent(r.days.join(',')):'')+'&start='+encodeURIComponent(r.start)+'&by=renew'});
  const pb=document.getElementById('portal');if(pb)pb.onclick=async()=>{if(busy)return;busy=true;pb.disabled=true;try{const o=await api('portal',{});location.href=o.url}catch(e){toast(e.message,true)}busy=false;pb.disabled=false};
  document.getElementById('req').onsubmit=async(e)=>{e.preventDefault();if(busy)return;const btn=document.getElementById('send');busy=true;btn.disabled=true;btn.textContent='Sending…';
    try{await api('request',{kind:document.getElementById('kind').value,player:document.getElementById('player').value,when:document.getElementById('when').value,phone:document.getElementById('phone').value,text:document.getElementById('text').value,name:me.name});toast('Sent — the front desk will get back to you.');me=await api('me');render();location.hash='#requests'}catch(x){toast(x.message,true);busy=false;btn.disabled=false;btn.innerHTML='Send to the front desk <span class="ar">→</span>'}
    busy=false};
}

/* ── boot ── */
firebase.initializeApp(CFG);auth=firebase.auth();
(async()=>{
  if(auth.isSignInWithEmailLink(location.href)){
    const email=localStorage.getItem(EMAIL_KEY);
    if(email){try{await auth.signInWithEmailLink(email,location.href);localStorage.removeItem(EMAIL_KEY);history.replaceState(null,'',location.pathname)}catch(x){gate('ask',{err:cleanErr(x)});return}}
    else{gate('ask');return}
  }
  try{await auth.getRedirectResult()}catch(x){gate('in',{err:cleanErr(x)});return}
  auth.onAuthStateChanged(u=>{if(u)load();else{me=null;gate('in')}});
})();
})();
</script>
</body>
</html>
