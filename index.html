    --logo-filter:invert(1);--shadow:0 10px 30px rgba(0,0,0,.12);--warn:#C24FC5;--warn-ink:#7A1F7D;
  }
}
:root[data-theme="light"]{
  --bg:#FFFFFF;--panel:#F5F5F1;--raised:#ECECE6;--line:#DCDCD3;--line2:#C4C4BA;
  --text:#0A0A0A;--muted:#5C5C55;--faint:#8A8A82;--accent-ink:#0A0A0A;
  --logo-filter:invert(1);--shadow:0 10px 30px rgba(0,0,0,.12);--warn:#C24FC5;--warn-ink:#7A1F7D;
}
:root[data-theme="dark"]{
  --bg:#050505;--panel:#0F0F0F;--raised:#181818;--line:#272727;--line2:#3a3a3a;
  --text:#F4F4F0;--muted:#9B9B93;--faint:#6C6C65;--accent-ink:#E2FE78;
  --logo-filter:none;--shadow:0 10px 30px rgba(0,0,0,.5);--warn:#E286E4;--warn-ink:#F0B4F1;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 14px/1.5 var(--body);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
.disp{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:.95}
.lbl{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.wrap{max-width:1160px;margin:0 auto;padding-inline:20px}
@media (max-width:520px){.wrap{padding-inline:16px}}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:16px;min-height:60px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left}
.brand img{height:17px;width:auto;display:block;filter:var(--logo-filter)}
.brand .sep{width:1px;height:20px;background:var(--line2)}
.brand .name{font-family:var(--display);font-style:italic;font-weight:800;font-size:21px;text-transform:uppercase;color:var(--accent-ink);line-height:1;padding-top:2px}
.bar .grow{flex:1 1 auto}
.search{position:relative;flex:1 1 220px;max-width:340px}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 12px;font-size:13px}
.search input::placeholder{color:var(--faint)}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line2);border-radius:8px;box-shadow:var(--shadow);max-height:340px;overflow:auto;padding:4px}
.results button{display:flex;justify-content:space-between;gap:12px;width:100%;background:none;border:0;border-radius:5px;padding:9px 10px;text-align:left}
.results button:hover,.results button:focus-visible{background:var(--raised)}
.results small{color:var(--muted)}
.live{display:inline-flex;align-items:center;gap:7px;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.live.on i{background:var(--mint);box-shadow:0 0 0 3px color-mix(in srgb,var(--mint) 25%,transparent)}
.live.off i{background:var(--pink)}

main{padding-block:28px 120px}
.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.crumbs button{background:none;border:0;padding:0;color:var(--muted);font-size:12px;font-weight:600}
.crumbs button:hover{color:var(--text)}
.crumbs span{color:var(--faint);font-size:12px}
h1.title{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:clamp(38px,6.2vw,64px);line-height:.92;margin:0;text-wrap:balance}
h1.title em{font-style:italic;color:var(--accent-ink)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:26px}
.head .sub{margin-top:10px;color:var(--muted);font-size:13px;max-width:62ch}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:34px}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{border:1px solid var(--line);border-radius:8px;padding:16px 18px;background:var(--panel)}
.stat b{display:block;font-family:var(--display);font-style:italic;font-weight:800;font-size:46px;line-height:.95}
.stat .of{font-family:var(--body);font-style:normal;font-weight:600;font-size:13px;color:var(--muted);margin-left:6px}
.stat.lead{background:var(--lime);border-color:var(--lime);color:#000}
.stat.lead .lbl,.stat.lead .of{color:#000;opacity:.72}

.sect{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 14px}
.sect h2{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0}

/* groups */
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-bottom:38px}
.group{display:flex;flex-direction:column;gap:14px;text-align:left;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:20px;transition:border-color .15s,transform .15s}
.group:hover{border-color:var(--gc,var(--lime));transform:translateY(-2px)}
@media (prefers-reduced-motion:reduce){.group{transition:none}.group:hover{transform:none}}
.group .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.group .gname{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:30px;line-height:.95}
.group .count{font-family:var(--display);font-style:italic;font-weight:800;font-size:30px;line-height:.95;color:var(--gc,var(--lime))}
:root[data-theme="light"] .group .count{color:var(--text)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .group .count{color:var(--text)}}
.group .dir{font-size:12px;color:var(--muted);min-height:18px}
.cov{display:grid;gap:8px}
.cov .row{display:grid;grid-template-columns:74px 1fr auto;gap:10px;align-items:center;font-size:11px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--raised);overflow:hidden}
.meter i{display:block;height:100%;background:var(--gc,var(--lime));border-radius:3px}
.cov .n{font-weight:600;color:var(--text)}

/* lists */
.list{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.rowb{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 16px}
.list>.rowb:last-child{border-bottom:0}
button.rowb:hover{background:var(--raised)}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.ava{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--raised);border:1px solid var(--line2)}
.who .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:10.5px;font-weight:700;letter-spacing:.04em;white-space:nowrap;border:1px solid var(--line2);color:var(--muted)}
.chip.done{background:var(--lime);border-color:var(--lime);color:#000}
.chip.draft{border-style:dashed;color:var(--text)}
.chip.tier{border-color:var(--line2);color:var(--text)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
@media (max-width:700px){.rowb{grid-template-columns:minmax(0,1fr);gap:8px}.rowb .mid{display:none}.rowb .chips{justify-content:flex-start;padding-left:46px}}
@media (max-width:700px){.rowb .who:has(.dot)+.mid+.chips{padding-left:20px}}
.empty{border:1px dashed var(--line2);border-radius:8px;padding:28px 20px;color:var(--muted);text-align:center;font-size:13px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:6px;border:1px solid var(--line2);background:var(--panel);padding:9px 14px;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--text)}
.btn.pri{background:var(--lime);border-color:var(--lime);color:#000}
.btn.pri:hover{filter:brightness(1.05)}
.btn.ghost{background:none}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.danger:hover{border-color:var(--pink);color:var(--pink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.fchip{border:1px solid var(--line2);background:none;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:11px 14px;font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent-ink)}

/* panels / forms */
.panel{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.field{display:grid;gap:6px;min-width:0}
.field>label,.field>.flabel{font-weight:600;font-size:13px}
.hint{font-size:12px;color:var(--muted);max-width:70ch}
input[type=text],input[type=email],input[type=date],input[type=url],input[type=number],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:10px 12px;font-size:14px}
textarea{resize:vertical;min-height:72px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent-ink)}
.starts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.start{display:grid;gap:10px;align-content:start;text-align:left;border:1px solid var(--line2);border-radius:8px;background:var(--panel);padding:12px 14px;min-width:170px}
.start.wide{flex:1 1 440px}
.start:hover{border-color:var(--pc,var(--lime))}
.sbtn{display:grid;gap:3px;text-align:left;background:none;border:0;padding:0}
.sbtn b{font-size:13px}
.sbtn small{color:var(--muted);font-size:11.5px}
.start.rec{border-color:var(--pc,var(--lime));box-shadow:inset 3px 0 0 var(--pc,var(--lime))}

/* editor */
.ed-head{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px}
.ed-head h1{font-size:clamp(30px,4.6vw,46px)}
.sec-tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--barh,61px));z-index:20;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:10px 0;border-bottom:1px solid var(--line);margin-top:8px}
#secbody{padding-top:16px}
#edpanel{margin-bottom:0}
.sec-tab{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:none;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;white-space:nowrap;color:var(--muted)}
.sec-tab[aria-selected="true"]{background:var(--pc);border-color:var(--pc);color:#000}
.sec-tab .n{font-weight:600;opacity:.75}
.sec-tab.ok .n::after{content:"";display:inline-block;width:.3em;height:.58em;border:solid currentColor;border-width:0 .15em .15em 0;transform:rotate(45deg);margin:0 .1em .08em .5em}
.banner{background:var(--pc);color:#000;border-radius:8px;padding:16px 18px;margin-bottom:18px}
.banner h2{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:30px;line-height:.95;margin:0}
.banner p{margin:6px 0 0;font-size:12.5px;opacity:.78}
.fields{display:grid;gap:16px;max-width:860px}
.fields>.field{padding:8px 10px;margin-inline:-10px}
.fhead{display:flex;flex-direction:column;gap:6px;border-left:4px solid var(--pc);background:var(--raised);padding:9px 12px;border-radius:0 6px 6px 0;margin-top:10px}
.fhead b{font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.fnote{font-size:12.5px;color:var(--muted);border:1px dashed var(--line2);border-radius:6px;padding:10px 12px;max-width:80ch}
.rate{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:10px;margin-inline:-10px;border-bottom:1px solid var(--line)}
.rate .txt b{font-weight:600;font-size:13.5px;display:block}
.rate .ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.grp{display:flex;gap:6px;flex-wrap:wrap;border-radius:22px}
.rb{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line2);background:none;font-weight:700;font-size:14px;color:var(--muted)}
.rb:hover{border-color:var(--text);color:var(--text)}
.rb[aria-checked="true"]{background:var(--pc);border-color:var(--pc);color:#000}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.sg{border:1.5px solid var(--line2);background:none;border-radius:6px;padding:8px 11px;font-size:12px;font-weight:600;color:var(--muted)}
.sg:hover{border-color:var(--text);color:var(--text)}
.sg[aria-checked="true"]{background:var(--pc);border-color:var(--pc);color:#000}
.sg .k{display:inline-block;min-width:15px;margin-right:6px;font-size:10.5px;font-weight:700;opacity:.55}
.noteb{border:0;background:none;color:var(--muted);font-size:11.5px;font-weight:600;padding:4px 6px;border-radius:4px}
.noteb:hover{color:var(--text)}
.noteb.has{color:var(--accent-ink)}
.rate .nin{grid-column:1/-1}
.metric{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(250px,auto);gap:6px 14px;align-items:center;padding:10px;margin-inline:-10px;border-bottom:1px solid var(--line)}
.metric b{font-weight:600;font-size:13.5px}
.metric .bench{font-size:12px;color:var(--muted)}
.metric .val{display:flex;align-items:center;gap:6px}
.metric .val input{padding:8px 10px;width:92px;flex:none}
.metric .val span{font-size:11px;color:var(--muted);white-space:nowrap}
.metric .prev{grid-column:1/-1;font-size:11.5px;color:var(--muted)}
.metric .nin{grid-column:1/-1}
@media (max-width:760px){.rate{grid-template-columns:1fr}.metric{grid-template-columns:1fr}}
.tfoot{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ai{border:1px solid var(--line2);background:none;border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:700;color:var(--muted)}
.ai:hover{color:var(--text);border-color:var(--text)}
.ai[disabled]{opacity:.5}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.scorebox{border-radius:8px;padding:12px;color:#000;display:grid;gap:6px}
.scorebox label{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.scorebox input{background:rgba(255,255,255,.55);border:1.5px solid rgba(0,0,0,.35);color:#000;font-family:var(--display);font-style:italic;font-weight:800;font-size:28px;padding:4px 10px}
.scorebox small{font-size:11px;opacity:.7}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.dock .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dock .state{font-size:12px;color:var(--muted);margin-right:auto;display:flex;align-items:center;gap:8px}
.nextprev{display:flex;justify-content:space-between;gap:10px;margin-top:26px;max-width:860px}

/* report */
.report{max-width:860px}
.rbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:20px}
.rbox div{background:var(--panel);padding:12px 14px}
.rbox b{display:block;font-size:14px;margin-top:3px}
.rscores{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:22px}
.rscores div{border-radius:8px;padding:12px 14px;color:#000}
.rscores b{display:block;font-family:var(--display);font-style:italic;font-weight:800;font-size:38px;line-height:1}
.rsec{margin-bottom:26px}
.rline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.rline .pips{display:flex;gap:5px}
.pip{width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:11px;color:var(--faint);font-weight:600}
.pip.on{background:var(--pc);border-color:var(--pc);color:#000;font-weight:700}
.rline .cn{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.rtext{padding:10px 0;border-bottom:1px solid var(--line)}
.rtext p{margin:4px 0 0;white-space:pre-wrap;max-width:75ch}
.pill{display:inline-block;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700;background:var(--pc);color:#000}

/* videos / journal */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.vcard{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:14px;display:grid;gap:8px;align-content:start}
.vcard.sel{border-color:var(--accent-ink)}
.vcard h3{margin:0;font-size:14px}
.vcard p{margin:0;font-size:12.5px;color:var(--muted)}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:18px}
.jentry{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:16px;display:grid;gap:10px}
.jentry.coach{box-shadow:inset 3px 0 0 var(--cyan)}
.jentry.player{box-shadow:inset 3px 0 0 var(--lime)}
.jentry dl{margin:0;display:grid;gap:8px}
.jentry dt{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.jentry dd{margin:2px 0 0;white-space:pre-wrap}
.cmt{background:var(--raised);border-radius:6px;padding:8px 10px;font-size:13px}
.stack{display:grid;gap:12px}
.rowx{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--text);color:var(--bg);border-radius:6px;padding:10px 16px;font-size:13px;font-weight:600;box-shadow:var(--shadow);max-width:min(92vw,520px)}
.notice{border:1px solid var(--line2);border-radius:8px;padding:12px 14px;font-size:13px;color:var(--muted);margin-bottom:18px}

@media (max-width:560px){.dock .state{flex-basis:100%;margin:0}.dock .btn{flex:1 1 0;padding:9px 6px;font-size:12px;white-space:normal;line-height:1.2}main{padding-bottom:170px}}

/* parts: one report, each coach opens their own part */
.ptabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.ptab{display:grid;gap:4px;text-align:left;border:1.5px solid var(--line2);border-radius:8px;background:var(--panel);padding:11px 14px;box-shadow:inset 4px 0 0 var(--pc)}
.ptab b{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:24px;line-height:.95}
.ptab small{font-size:11.5px;font-weight:600;color:var(--muted)}
.ptab:hover{border-color:var(--pc)}
.ptab[aria-selected="true"]{background:var(--pc);border-color:var(--pc);color:#000}
.ptab[aria-selected="true"] small{color:#000;opacity:.72}
.ck::before,.ptab.done small::before{content:"";display:inline-block;width:.32em;height:.62em;border:solid currentColor;border-width:0 .16em .16em 0;transform:rotate(45deg);margin:0 .55em .06em .15em}
.pchips{display:inline-flex;gap:3px;align-items:center}
.pc{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:700;border:1px solid var(--line2);color:var(--faint)}
.pc.prog{border-color:var(--text);border-style:dashed;color:var(--text)}
.pc.done{background:var(--pc);border-color:var(--pc);color:#000}
.arow{border-bottom:1px solid var(--line)}
.list>.arow:last-child{border-bottom:0}
.arow .rowb{border-bottom:0}
.pstrip,.pbtns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pstrip{padding:0 16px 13px 36px}
.pbtn{display:grid;gap:1px;text-align:left;border:1px solid var(--line2);border-radius:6px;background:none;padding:6px 11px 6px 13px;box-shadow:inset 3px 0 0 var(--pc);min-width:118px}
.pbtn b{font-size:12px}
.pbtn small{font-size:11px;color:var(--muted)}
.pbtn:hover{border-color:var(--text)}
.pbtn.done{background:color-mix(in srgb,var(--pc) 18%,transparent)}
.pbtn.mini{min-width:0;padding:5px 10px 5px 12px}
.flbl{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.fchip.part{box-shadow:inset 3px 0 0 var(--pc);border-radius:6px;color:var(--text)}
.fchip.part[aria-pressed="true"]{background:var(--pc);border-color:var(--pc);color:#000;box-shadow:none}
.chip.ready{background:var(--mint);border-color:var(--mint);color:#000}
.chip.go{background:var(--pc,var(--lime));border-color:var(--pc,var(--lime));color:#000}
.qsel{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--muted)}
.qsel select{width:auto;padding:8px 10px;font-size:13px}
.lockbar{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;border:1px solid var(--line2);border-radius:8px;padding:12px 14px;margin-bottom:16px;background:var(--panel);max-width:860px}
.locked .rb,.locked .sg{cursor:default}
.locked input:disabled,.locked textarea:disabled{opacity:1;color:var(--text);-webkit-text-fill-color:var(--text);background:var(--panel)}
.recap{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:14px 16px;display:grid;gap:12px}
.recap .rc{display:grid;gap:4px;padding-left:12px;box-shadow:inset 3px 0 0 var(--pc)}
.recap p{margin:0;white-space:pre-wrap;font-size:13px;max-width:75ch}

/* required fields + keyboard flow */
[data-stop]{border-radius:6px;scroll-margin:140px}
[data-stop]:focus-within{background:color-mix(in srgb,var(--pc) 11%,transparent);box-shadow:inset 3px 0 0 var(--pc)}
.scorebox[data-stop]:focus-within{box-shadow:0 0 0 3px var(--text)}
[data-grp]:focus{outline:none}
[data-grp]:focus-visible{outline:2px solid var(--accent-ink);outline-offset:3px}
.missing,.missing:focus-within{background:color-mix(in srgb,var(--warn) 13%,transparent);box-shadow:inset 3px 0 0 var(--warn)}
.scorebox.missing{box-shadow:0 0 0 3px var(--warn)}
.reqtag{display:none;margin-left:8px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--warn-ink)}
.missing .reqtag{display:inline}
.opt{margin-left:8px;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
input.need{border-color:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 25%,transparent)}
.nudge{animation:nudge .28s ease-in-out}
@keyframes nudge{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.kbhint{font-size:12px;line-height:1.9;color:var(--muted);margin:-4px 0 14px;max-width:860px}
.kbhint b{color:var(--text);margin-right:8px;font-size:10px;letter-spacing:.14em;text-transform:uppercase}
kbd{font:600 11px/1 var(--body);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:2px 5px;background:var(--panel);color:var(--text)}
.ntb{border:1px solid var(--line2);background:none;border-radius:4px;padding:5px 7px;font-size:10.5px;font-weight:700;color:var(--muted)}
.ntb:hover{color:var(--text);border-color:var(--text)}
.ntb[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--bg)}

/* dictation */
.inrow{display:flex;gap:8px;align-items:center}
.inrow input{flex:1 1 auto;min-width:0}
.micb{flex:none;width:40px;height:40px;border-radius:6px;border:1px solid var(--line2);background:none;display:grid;place-items:center;color:var(--muted)}
.micb:hover{color:var(--text);border-color:var(--text)}
.ai.mic{display:inline-flex;align-items:center;gap:6px}
.ai.mic i{display:none;width:8px;height:8px;border-radius:50%;background:#000}
.mic.rec{background:var(--lime);border-color:var(--lime);color:#000}
.ai.mic.rec i{display:inline-block;animation:pulse 1.1s ease-in-out infinite}
.ai.mic.rec svg{display:none}
@keyframes pulse{50%{opacity:.2}}
.listening{border-color:var(--lime)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--lime) 28%,transparent)}
.dstate{font-size:11.5px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.nudge,.ai.mic.rec i{animation:none}}
@media (max-width:560px){.pstrip{padding-left:16px}.pbtn{min-width:0;flex:1 1 40%}.ptab b{font-size:20px}}
.dcoach{margin-top:8px;border:1px solid var(--line2);border-radius:6px;box-shadow:inset 3px 0 0 var(--lime);background:var(--panel);padding:10px 12px 10px 14px;font-size:12.5px;display:grid;gap:8px;max-width:70ch}
.dcoach b{font-weight:700}
.dauto{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px}
.dauto input{width:15px;height:15px;accent-color:var(--lime)}
.dhelp summary{cursor:pointer;color:var(--muted);font-size:12px;font-weight:600}
.dhelp p{margin:6px 0 0;font-size:12px}

/* website edition: the door, the account menu, the staff page */
.gate{max-width:520px;margin:6vh auto 0;display:grid;gap:18px}
.gate .title{font-size:clamp(30px,11vw,64px)}
.gate .title em{display:block}   /* two-part phrase: one sentence per line, each sized to fit on its line */
.signin .btn.big,.btn.big{padding:13px 16px;font-size:14px;width:100%}
.or{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line2)}
.userbox{position:relative}
.ubtn{background:none;border:0;padding:0;border-radius:50%}
.umenu{position:absolute;right:0;top:calc(100% + 8px);min-width:240px;background:var(--panel);border:1px solid var(--line2);border-radius:8px;box-shadow:var(--shadow);padding:6px;z-index:40;display:grid;gap:2px}
.umenu .who2{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;display:grid;gap:2px}
.umenu .who2 small{color:var(--muted);font-size:12px;word-break:break-all}
.umenu button{background:none;border:0;border-radius:5px;padding:9px 10px;text-align:left;font-weight:600;font-size:13px}
.umenu button:hover,.umenu button:focus-visible{background:var(--raised)}
.srow{grid-template-columns:minmax(0,1fr) auto;cursor:default}
.srow .chips{align-items:center}
.srow select{padding:6px 8px;font-size:12px}
@media (max-width:700px){.srow{grid-template-columns:minmax(0,1fr)}}


/* sent to parents */
.chip.sent{border-color:var(--lime);color:var(--text)}
.chip.warn{border-color:var(--warn);color:var(--warn-ink);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.follow{border:1px solid var(--line2);border-radius:10px;margin:0 0 18px;overflow:hidden}
.furow{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;background:color-mix(in srgb,var(--warn) 10%,transparent);box-shadow:inset 3px 0 0 var(--warn)}
.furow+.furow{border-top:1px solid var(--line2)}
.furow.ok,.furow.calm{background:transparent;box-shadow:inset 3px 0 0 var(--lime)}
.furow.calm{box-shadow:inset 3px 0 0 var(--line2)}
.furow .hint{margin-top:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
button.notice.remind.calm{border-color:var(--line2);background:transparent}
button.notice.remind{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;width:100%;text-align:left;cursor:pointer;font:inherit;font-size:13px;color:var(--text);border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
button.notice.remind span{font-weight:700;text-decoration:underline;text-underline-offset:3px}
.signin .notice{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:0;color:var(--text);border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.signin .notice span{flex:1 1 220px}
.fupill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--text);border-radius:999px;padding:5px 10px 5px 12px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.fupill b{background:var(--text);color:var(--bg);border-radius:999px;min-width:20px;padding:1px 6px;text-align:center;font-size:11px}
.fupill:hover{background:color-mix(in srgb,var(--warn) 20%,transparent)}
/* try-outs */
.ava.when{width:auto;min-width:92px;height:auto;padding:6px 10px;border-radius:8px;font-size:12px;line-height:1.2;display:grid;place-items:center;text-align:center}
.ava.when small{display:block;font-weight:600;color:var(--muted);font-size:11px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px 18px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:16px 18px}
.kv .lbl{display:block;margin-bottom:3px}
.kv b{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.kv b.miss{color:var(--warn-ink);font-weight:600;font-style:italic}
.kv a{text-decoration:underline;text-underline-offset:3px}
@media (max-width:700px){.rowb .ava.when{min-width:0}}
@media (max-width:560px){.sect.wrapb{flex-wrap:wrap}.sect.wrapb .rowx{flex-basis:100%}}

</style>

<script>

  }
  const playerAssess = (pid) => S.assess.filter((a) => a.playerId === pid);
  function quarterlyFor(pid, q) { const mine = playerAssess(pid).filter((a) => a.period === q && QUARTERLY_TYPES.includes(a.type)); return mine.find((a) => a.status === 'final') || mine.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))[0] || null; }

  const sentChip = (a) => (!tracked(a) ? '' : isSent(a) ? '<span class="chip sent">Sent to parents</span>' : '<span class="chip warn">Not sent</span>');

  function statusChips(p) {
    const q = curQ(), m = mLabel(new Date()); const mine = playerAssess(p.id); const out = [];
    if (p.group !== 'camp') {

  /* ───────────── routing ───────────── */
  function parseHash() {

  async function go(r, fromHistory) {

    if (EDITION === 'web' && !fromHistory) { const h = toHash(r); if (location.hash !== h) { try { history.pushState(null, '', h); } catch (e) { /* noop */ } } }

  function onRoute(scroll) {

  /* ───────────── data wiring ───────────── */

    if (!db) { S.dbState = 'none'; paintLive(); render(); return; }

  function unsubscribePlayer() { S.psubs.forEach((u) => { try { u(); } catch (e) { /* noop */ } }); S.psubs = []; S.pdata = { pid: null, videos: [], journal: [], goals: null }; S.ui.compare = []; }

  function paintLive() {

  /* ─────────────────────────────────────────────────────────────────────────────
     WEBSITE EDITION — coach sign-in + Firestore.  (Inactive in the Claude-hosted edition.)

  const CFG = (typeof PW_CONFIG === 'object' && PW_CONFIG) || {};

  function guarded(p) {

    const clear = () => { done = true; clearTimeout(timer); if (late) { late = false; WEB.lag = Math.max(0, WEB.lag - 1); paintLive(); } };
    const w = p.then(clear, (e) => { const wasLate = late; clear(); const err = fsError(e); if (wasLate) { dbFail(err); return undefined; } throw err; });
    const wait = new Promise((res) => { timer = setTimeout(() => { if (done) return; late = true; WEB.lag++; paintLive(); res(); }, 4000); });

  // Firestore refuses `undefined` and, for data it cannot store, throws on the spot instead of returning a failed promise.
  // Keep every write plain JSON, and turn any such throw into an ordinary failure the portal already knows how to report.
  const plain = (d) => JSON.parse(JSON.stringify(d === undefined ? null : d));
  const attempt = (fn) => { try { return Promise.resolve(fn()); } catch (e) { return Promise.reject(e); } };
  const snapOf = (s) => ({ id: s.id, exists: !!s.exists, data: () => s.data(), metadata: s.metadata || {} });
  const qsnapOf = (s) => ({ docs: s.docs.map(snapOf), size: s.size, empty: s.empty, metadata: s.metadata || {} });
  function docRefOf(r) {
    return { id: r.id, path: r.path,
      get: () => r.get().then(snapOf, (e) => { throw fsError(e); }),
      set: (d) => guarded(attempt(() => r.set(plain(d)))),
      update: (d) => guarded(attempt(() => r.set(plain(d), { merge: true }))),   // Firestore's own update() REPLACES nested maps; merge-set deep-merges them, which is what the portal relies on

      onSnapshot: (next, err) => r.onSnapshot((s) => next(snapOf(s)), (e) => { if (err) err(fsError(e)); }),

  function queryOf(q) {

  function colRefOf(c) { return Object.assign(queryOf(c), { path: c.path, doc: (id) => docRefOf(id ? c.doc(id) : c.doc()), add: (d) => { const r = c.doc(); return guarded(attempt(() => r.set(plain(d)))).then(() => docRefOf(r)); } }); }
  const webDb = (fs) => ({ doc: (p) => docRefOf(fs.doc(p)), collection: (p) => colRefOf(fs.collection(p)) });

  /* AI clean-up goes through a small service that holds the key; the page only ever sends the coach's sign-in token */
  function webSample() {
    if (!CFG.aiEndpoint) return null;
    const call = async (input, opts) => {
      const tok = await WEB.auth.currentUser.getIdToken(); let r;
      try { r = await fetch(CFG.aiEndpoint, { method: 'POST', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + tok }, body: JSON.stringify({ input: String(input).slice(0, 24000), tier: (opts && opts.modelTier) || 'quick' }) }); }
      catch (e) { const err = new Error('network'); err.code = 'unavailable'; throw err; }
      if (!r.ok) { const err = new Error('ai ' + r.status); err.code = r.status === 429 ? 'rate_limited' : (r.status === 401 || r.status === 403) ? 'not_granted' : 'unavailable'; throw err; }
      const j = await r.json(); return { text: String(j.text || ''), truncated: !!j.truncated };
    };
    call.json = async (input, opts) => { const { text } = await call(input, opts); const m = text.match(/\{[\s\S]*\}/); return JSON.parse(m ? m[0] : text); };
    return call;
  }

  /* Frugal live queries. Firestore bills per document read, so listen to what the screen needs — this quarter, this month,
     the open player, the open assessment — never to every assessment ever written. */
  const AQ = { sets: {}, stop: {}, key: {} };
  function mergeAssess() { const m = new Map(); Object.keys(AQ.sets).forEach((k) => AQ.sets[k].forEach((r) => m.set(r.id, r))); S.assess = Array.from(m.values()).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)); S.loaded.assess = true; changed(); }
  function watch(name, key, start) {
    if (AQ.key[name] === key) return; if (AQ.stop[name]) { try { AQ.stop[name](); } catch (e) { /* noop */ } } delete AQ.stop[name]; AQ.key[name] = key;
    if (!key) { if (AQ.sets[name]) { delete AQ.sets[name]; mergeAssess(); } return; }
    AQ.stop[name] = start((list) => { AQ.sets[name] = list; mergeAssess(); });
  }
  function scopeWeb() {
    if (EDITION !== 'web' || WEB.stage !== 'in' || !S.db) return; const r = S.route; const now = new Date();
    const periods = Array.from(new Set([curQ(), qLabel(now), mLabel(now)]));
    watch('period', periods.join('|'), (put) => S.db.collection('assessments').where('period', 'in', periods).onSnapshot((s) => put(rowsOf(s)), () => {}));
    watch('player', r.view === 'player' ? r.pid : '', (put) => S.db.collection('assessments').where('playerId', '==', r.pid).onSnapshot((s) => put(rowsOf(s)), () => {}));
    watch('camp', r.view === 'group' && r.gid === 'camp' ? 'camp' : '', (put) => S.db.collection('assessments').where('group', '==', 'camp').onSnapshot((s) => put(rowsOf(s)), () => {}));
    watch('followup', 'on', (put) => S.db.collection('assessments').where('followUp', '==', true).onSnapshot((s) => put(rowsOf(s)), () => {}));   // finished reports with something still open, whatever the quarter
    const one = r.view === 'edit' || r.view === 'report' ? r.id : '';
    watch('one', one, (put) => S.db.doc('assessments/' + one).onSnapshot((d) => put(d.exists ? [Object.assign({ id: d.id }, d.data())] : []), () => {}));
    if (r.view === 'staff' && WEB.isAdmin) { if (!WEB.admin.length) {
      WEB.admin.push(WEB.fs.collection('staff').onSnapshot((s) => { WEB.staffList = rowsOf(s); if (S.route.view === 'staff') softRender(); }, () => {}));
      WEB.admin.push(WEB.fs.collection('requests').onSnapshot((s) => { WEB.requests = rowsOf(s); if (S.route.view === 'staff') softRender(); }, () => {})); } }
    else off(WEB.admin);
  }
  const softRender = () => { if (busy()) S.pendingRender = true; else render(); };

  /* ───────────── sign-in and the door ───────────── */
  async function connectWeb() {
    S.downloads = null; S.sample = null; S.dbState = 'none'; paintLive();
    if (!cfgReady()) { WEB.stage = 'setup'; renderGate(); return; }
    if (typeof firebase === 'undefined') { WEB.stage = 'nosdk'; renderGate(); return; }
    try {
      firebase.initializeApp(CFG.firebase); WEB.auth = firebase.auth(); WEB.fs = firebase.firestore();
      try { if (typeof WEB.fs.settings === 'function') WEB.fs.settings({ ignoreUndefinedProperties: true, merge: true }); } catch (e) { /* older build: the adapter strips undefined itself */ }
      try { if (typeof WEB.fs.enablePersistence === 'function') await WEB.fs.enablePersistence({ synchronizeTabs: true }); } catch (e) { /* private window or older browser: the in-memory cache is fine */ }
    } catch (e) { WEB.stage = 'nosdk'; WEB.note = String((e && e.message) || e); renderGate(); return; }
    try {

        const em = lsGet('pw_signin_email');

    try { if (typeof WEB.auth.getRedirectResult === 'function') await WEB.auth.getRedirectResult(); } catch (e) { WEB.note = authMsg(e); }

  }
  // Signing out also wipes this device's offline copy of the records (they are about children), so nothing is left behind on a
  // shared computer. The one exception: if something typed here hasn't reached the server yet, the copy is kept so the work isn't
  // lost. Firestore holds it under that coach's own sign-in and sends it the next time they sign in on this device.
  async function signOutHere() {
    if (E) { try { await flushEd(E, true); } catch (e) { /* leave anyway */ } }
    WEB.note = ''; let unsent = WEB.lag > 0;
    if (!unsent && WEB.fs && typeof WEB.fs.waitForPendingWrites === 'function') {
      try { unsent = await Promise.race([WEB.fs.waitForPendingWrites().then(() => false, () => false), new Promise((res) => setTimeout(() => res(true), 2500))]); } catch (e) { unsent = false; }
    }
    const wipe = !unsent && WEB.fs && typeof WEB.fs.terminate === 'function' && typeof WEB.fs.clearPersistence === 'function';

  }

  function leaveApp() { closeEditor(); unsubscribePlayer(); off(WEB.core); off(WEB.admin); Object.keys(AQ.stop).forEach((k) => { try { AQ.stop[k](); } catch (e) { /* noop */ } }); AQ.sets = {}; AQ.stop = {}; AQ.key = {}; S.db = null; S.players = []; S.groups = []; S.assess = []; S.tryouts = []; S.loaded = {}; S.dbState = 'none'; S.sample = null; const d = $('#dock'); if (d) d.hidden = true; }
  function onUser(u) {
    off(WEB.gate); if (WEB.stage === 'in') leaveApp();
    WEB.user = u || null; WEB.email = u ? String(u.email || '').trim().toLowerCase() : ''; WEB.isAdmin = false; WEB.staff = null; WEB.asked = false;
    if (!u) { if (WEB.stage !== 'confirm') WEB.stage = 'out'; paintLive(); paintUser(); renderGate(); return; }
    if (!WEB.email || WEB.email.includes('/') || !u.emailVerified) { WEB.stage = 'unverified'; paintUser(); renderGate(); return; }
    if (!lsGet('pw_coach') && u.displayName) lsSet('pw_coach', String(u.displayName).trim().split(/\s+/)[0]);

    const decide = async (rec) => {
      const my = ++WEB.seq; let ok = !!(rec && rec.active === true); let admin = ok && rec.role === 'admin';

        // This way nothing about who the owners are has to live in this public page.

        if (my !== WEB.seq || WEB.user !== u) return;

        if (ok) WEB.fs.doc('staff/' + WEB.email).set({ email: WEB.email, name: String(u.displayName || ''), role: 'admin', active: true, owner: true, addedAt: Date.now() }).catch(() => {});
      }
      WEB.staff = rec; WEB.isAdmin = admin;
      if (ok) { if (WEB.stage !== 'in') enterApp(); else { paintUser(); if (S.route.view === 'staff' && !WEB.isAdmin) go({ view: 'home' }); } return; }
      if (WEB.stage === 'in') leaveApp(); WEB.stage = 'pending'; fileRequest(); paintUser(); renderGate();
    };

  }
  function fileRequest() { // tells the administrators someone is waiting; the rules only let a person write their own request
    if (WEB.asked || !WEB.user) return; WEB.asked = true;

  }
  function enterApp() {
    WEB.stage = 'in'; S.db = webDb(WEB.fs); S.canWrite = true; S.dbState = 'live'; S.sample = webSample(); paintLive(); paintUser();
    WEB.core.push(S.db.collection('groups').onSnapshot((s) => { S.groups = rowsOf(s); S.loaded.groups = true; changed(); }, () => {}));
    WEB.core.push(S.db.collection('players').onSnapshot((s) => { S.players = rowsOf(s); S.loaded.players = true; changed(); }, () => {}));
    WEB.core.push(S.db.collection('tryouts').onSnapshot((s) => { S.tryouts = rowsOf(s); S.loaded.tryouts = true; changed(); }, () => {}));

  function gateShell(inner) {
    const m = $('main'); if (!m) return; const d = $('#dock'); if (d) d.hidden = true; const sb = $('.search'); if (sb) sb.hidden = true;
    m.innerHTML = `<div class="wrap"><div class="gate"><div class="lbl">ProWorld High Performance Academy · coaching staff</div><h1 class="title">Individually built. <em>Fully connected.</em></h1>${inner}</div></div>`;
  }
  function renderGate() {
    const note = WEB.note ? `<div class="notice" role="alert">${esc(WEB.note)}</div>` : ''; const st = WEB.stage;
    if (st === 'setup') return gateShell(`<div class="panel stack"><b>This site isn’t connected to its database yet.</b><p class="hint">Paste the Firebase settings into the “site settings” block near the bottom of this page’s file, then upload it again. Until then nothing is stored and nobody can sign in.</p></div>`);
    if (st === 'nosdk') return gateShell(`<div class="panel stack"><b>The sign-in service didn’t load.</b><p class="hint">Check the internet connection and reload. If a content blocker is on, allow gstatic.com and googleapis.com for this site.</p>${note}</div>`);
    if (st === 'checking' || st === 'boot') return gateShell('<div class="panel"><span class="muted">Checking your access…</span></div>');
    if (st === 'unverified') return gateShell(`<div class="panel stack"><b>Google couldn’t confirm that email address for us.</b><p class="hint">This can happen when a Google account was made with an address from somewhere else (Yahoo, Outlook, iCloud…). Use a Gmail or Google Workspace account instead${EMAIL_LINK ? ', or an emailed sign-in link' : ''}, and tell your administrator which address you’ll be using.</p><div class="rowx"><button class="btn" data-wact="signout">Use a different account</button></div></div>`);
    if (st === 'pending') return gateShell(`<div class="panel stack"><b>You’re signed in, but not on the staff list yet.</b>
      <p class="hint">An administrator has been told that <b>${esc(WEB.email)}</b> is waiting. This page opens by itself the moment you’re approved — you don’t need to reload.</p>
      <div class="rowx"><button class="btn" data-wact="signout">Use a different account</button></div></div>`);
    if (st === 'sent') return gateShell(`<div class="panel stack"><b>Check your email.</b><p class="hint">A sign-in link is on its way to <b>${esc(lsGet('pw_signin_email'))}</b>. Open it on this device and you’re in — there is no password. It can take a minute; look in spam if it doesn’t show.</p><div class="rowx"><button class="btn ghost" data-wact="back-signin">Use a different address</button></div></div>`);
    if (st === 'confirm') return gateShell(`<form class="panel stack" data-wform="confirm"><b>Almost there.</b><p class="hint">This link was opened on a different device from the one that asked for it. Type the same email address to finish signing in.</p>${note}
      <div class="field"><label for="w_cemail">Email address</label><input id="w_cemail" name="email" type="email" required autocomplete="email"></div><div class="rowx"><button class="btn pri" type="submit">Finish signing in</button></div></form>`);

    const block = (title, hint, list, row) => (list.length ? `<div class="sect"><h2>${esc(title)}</h2><span class="muted" style="font-size:12px">${list.length}</span></div><p class="hint" style="margin:-6px 0 10px">${esc(hint)}</p><div class="list" style="margin-bottom:26px">${list.map(row).join('')}</div>` : '');
    const any = fu.unsent.length + fu.noMeeting.length + fu.late.length + fu.upcoming.length;
    return `${crumbs([{ t: 'All groups', r: { view: 'home' } }, { t: 'Follow-up' }])}
      <div class="head"><div><div class="lbl">After the report is final</div><h1 class="title">Follow-<em>up.</em></h1>
      <div class="sub">Every finished report gets sent to the family and gets a parent meeting. This is what is still open, oldest first. Open a report to tick things off.</div></div></div>
      ${block('Not sent to the parents', 'Send the PDF, then press “Mark as sent to parents” on the report.', fu.unsent, (a) => rowAssess(a, true, false))}
      ${block('Parent meeting not set', 'Agree a date with the family and record it on the report.', fu.noMeeting, (a) => rowAssess(a, true, false))}
      ${block('Meeting date has passed', 'Did it happen? Mark it as held, or set a new date.', fu.late, meetRow)}
      ${block('Parent meetings coming up', 'In date order. Mark each one as held once it has happened.', fu.upcoming, meetRow)}
      ${any ? '' : `<div class="empty">${S.loaded.assess ? 'Nothing is open. Every finished report has been sent and its parent meeting held.' : 'Loading…'}</div>`}`;
  }
  function partStrip(a, def) {
    return `<div class="pstrip" role="group" aria-label="Open one part directly">${partState(a, def).map((x) => `<button class="pbtn${x.done ? ' done' : ''}" style="--pc:${PILLAR[x.part.pillar]}" ${goAttr({ view: 'edit', id: a.id, part: x.part.id })}><b>${esc(x.part.label)}</b><small>${esc(partNote(x))}</small></button>`).join('')}</div>`;
  }
  function rowAssess(a, withPlayer, withParts) {
    const def = FORMS[a.type] || { short: a.type, pillar: 'tennis' }; const p = player(a.playerId); const nm = p ? p.name : (a.playerName || 'Player');
    const st = a.status === 'final' ? '<span class="chip done">Final</span>' + sentChip(a) + meetChip(a) : partChips(a, def) + draftChip(a, def, '');
    const r = a.status === 'final' || !writable() ? { view: 'report', id: a.id } : { view: 'edit', id: a.id };
    const row = `<button class="rowb" ${goAttr(r)}>
      <div class="who"><span class="dot" style="background:${PILLAR[def.pillar]}"></span><div style="min-width:0"><div class="nm">${esc(withPlayer ? nm : def.title)}</div><small>${esc(withPlayer ? def.short + ' · ' : '')}${esc(a.period || '')}${a.coach ? ' · ' + esc(a.coach) : ''}</small></div></div>
      <div class="mid muted" style="font-size:12px">Updated ${esc(fmtDate(a.updatedAt))}</div><div class="chips">${st}</div></button>`;
    return withParts && multi(def) && a.status !== 'final' && writable() ? `<div class="arow">${row}${partStrip(a, def)}</div>` : row;
  }

  /* ───────────── view: group ───────────── */
  function viewGroup(gid) {
    const g = group(gid); const def = FORMS[g.form] || FORMS.quarterly_hp; const q = curQ();
    const all = S.players.filter((p) => p.group === gid); const list = all.filter((p) => S.ui.showInactive || active(p));
    const coaches = Array.from(new Set(list.map((p) => p.coach || ''))).sort((a, b) => (a === '' ? 1 : b === '' ? -1 : a.localeCompare(b)));
    const fc = S.ui.coachFilter !== undefined && S.ui.coachFilter !== null && S.ui.coachFilterGroup === gid ? S.ui.coachFilter : null;
    const pf = multi(def) && S.ui.partFilter && S.ui.partFilterGroup === gid ? def.parts.find((x) => x.id === S.ui.partFilter) : null;
    const needs = (p, pid) => { const a = quarterlyFor(p.id, q); if (a && a.status === 'final') return false; const st = a && a.parts && a.parts[pid]; return !(st && st.done); };
    const shown = list.filter((p) => (fc === null ? true : (p.coach || '') === fc)).filter((p) => !pf || needs(p, pf.id)).sort((a, b) => a.name.localeCompare(b.name));
    const rows = shown.map((p) => {
      const who = `<div class="who"><span class="ava">${esc(initials(p.name))}</span><div style="min-width:0"><div class="nm">${esc(p.name)}${active(p) ? '' : ' <span class="muted">(inactive)</span>'}</div><small>${p.coach ? 'Coach ' + esc(p.coach) : 'No coach assigned'}${p.coach2 ? ' · with ' + esc(p.coach2) : ''}</small></div></div>
        <div class="mid muted" style="font-size:12px">${EDITION === 'web' ? (p.tier ? 'Tier ' + esc(p.tier) : '') : playerAssess(p.id).filter((a) => a.status === 'final').length + ' on file' + (p.tier ? ' · Tier ' + esc(p.tier) : '')}</div>`;
      if (pf && writable()) return `<button class="rowb" data-act="open-part" data-pid="${esc(p.id)}" data-part="${pf.id}">${who}<div class="chips">${partChips(quarterlyFor(p.id, q), def)}<span class="chip go" style="--pc:${PILLAR[pf.pillar]}">Fill in ${esc(pf.label)}</span></div></button>`;
      return `<button class="rowb" ${goAttr({ view: 'player', pid: p.id })}>${who}<div class="chips">${statusChips(p)}</div></button>`;
    }).join('');
    const inactiveN = all.length - all.filter(active).length;
    const todo = multi(def) && gid !== 'camp' ? `<div class="filters" role="group" aria-label="Show players who still need one part">
        <span class="flbl">${esc(q)} to do</span>
        ${def.parts.map((x) => `<button class="fchip part" style="--pc:${PILLAR[x.pillar]}" aria-pressed="${!!pf && pf.id === x.id}" data-act="pfilter" data-v="${x.id}">${esc(x.label)} ${list.filter((p) => needs(p, x.id)).length}</button>`).join('')}
        ${pf ? '<button class="fchip" data-act="pfilter" data-v="">Show everyone</button>' : ''}</div>
        ${pf ? `<p class="hint" style="margin:-4px 0 14px">Players whose ${esc(pf.label)} part isn’t complete for ${esc(q)}. Pick a player to go straight to the ${esc(pf.label)} part — you come back to this list when you finish it.</p>` : ''}` : '';
    const empty = pf ? `Every player’s ${esc(pf.label)} part is complete for ${esc(q)}.` : (S.loaded.players || S.dbState === 'none' ? 'No players in this group yet.' : 'Loading roster…');
    return `${notice()}${crumbs([{ t: 'All groups', r: { view: 'home' } }, { t: g.label }])}
      <div class="head"><div><div class="lbl">${esc(g.director || '')}</div><h1 class="title">${esc(g.label)}</h1></div>
        <div class="rowx">${gid !== 'camp' ? `<label class="qsel" for="g_q">Quarter <select id="g_q" data-act="setq">${quarterOptions().map((o) => `<option ${o === q ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></label>` : ''}${writable() ? `<button class="btn pri" data-act="toggle-add">Add player</button>` : ''}</div></div>
      <div id="addp" ${S.ui.adding ? '' : 'hidden'}>${S.ui.adding ? addPlayerPanel(gid) : ''}</div>
      ${todo}
      <div class="filters" role="group" aria-label="Filter by coach">
        <button class="fchip" aria-pressed="${fc === null}" data-act="fcoach" data-v="__all">All ${list.length}</button>
        ${coaches.map((c) => `<button class="fchip" aria-pressed="${fc === c}" data-act="fcoach" data-v="${esc(c)}">${esc(c || 'No coach')} ${list.filter((p) => (p.coach || '') === c).length}</button>`).join('')}
        ${inactiveN ? `<button class="fchip" aria-pressed="${!!S.ui.showInactive}" data-act="inactive">Show inactive (${inactiveN})</button>` : ''}
      </div>
      ${rows ? `<div class="list">${rows}</div>` : `<div class="empty">${empty}</div>`}`;
  }
  function coachList() { return Array.from(new Set(S.players.map((p) => p.coach).concat(S.players.map((p) => p.coach2)).filter(Boolean))).sort(); }
  function addPlayerPanel(gid) {
    return `<form class="panel stack" data-form="add-player" data-gid="${esc(gid)}" style="margin-bottom:18px"><div class="grid2">
      <div class="field"><label for="ap_name">Player name</label><input id="ap_name" name="name" type="text" required autocomplete="off" placeholder="First name + last initial"></div>
      <div class="field"><label for="ap_tier">Tier</label><select id="ap_tier" name="tier"><option value="">—</option><option>A</option><option>B</option><option>C</option></select></div>
      <div class="field"><label for="ap_coach">Primary coach</label><input id="ap_coach" name="coach" type="text" list="coachlist" autocomplete="off"></div>

  }

  /* ───────────── view: player ───────────── */
  function viewPlayer(pid, tab) {
    const p = player(pid);
    if (!p) return `${notice()}${crumbs([{ t: 'All groups', r: { view: 'home' } }])}<div class="empty">${S.loaded.players || S.dbState === 'none' ? 'This player isn’t on the roster.' : 'Loading player…'}</div>`;
    const g = group(p.group);
    const tabs = [['assessments', 'Assessments'], ['videos', 'Videos'], ['journal', 'Journal']].map(([k, t]) => `<button class="tab" role="tab" aria-selected="${tab === k}" ${goAttr({ view: 'player', pid, tab: k })}>${t}</button>`).join('');
    return `${notice()}${crumbs([{ t: 'All groups', r: { view: 'home' } }, { t: g.label, r: { view: 'group', gid: g.id } }, { t: p.name }])}
      <div class="head"><div><div class="lbl">${esc(g.label)}${p.tier ? ' · Tier ' + esc(p.tier) : ''}${active(p) ? '' : ' · Inactive'}</div><h1 class="title">${esc(p.name)}</h1>
        <div class="sub">${p.coach ? 'Primary coach ' + esc(p.coach) : 'No coach assigned'}${p.coach2 ? ' · Secondary ' + esc(p.coach2) : ''}${p.fitness ? ' · Fitness ' + esc(p.fitness) : ''}</div></div>
        <div class="rowx">${writable() ? `<button class="btn" data-act="toggle-edit">Edit player</button>` : ''}</div></div>
      <div id="editp" ${S.ui.editing ? '' : 'hidden'}>${S.ui.editing ? editPlayerPanel(p) : ''}</div>
      <div class="tabs" role="tablist">${tabs}</div>
      ${tab === 'videos' ? tabVideos(p) : tab === 'journal' ? tabJournal(p) : tabAssess(p)}`;
  }
  function editPlayerPanel(p) {
    const sel = (v, o) => `<option ${v === o ? 'selected' : ''}>${esc(o)}</option>`;
    return `<form class="panel stack" data-form="edit-player" data-pid="${esc(p.id)}" style="margin-bottom:18px"><div class="grid2">
      <div class="field"><label for="ep_name">Player name</label><input id="ep_name" name="name" type="text" required value="${esc(p.name)}"></div>
      <div class="field"><label for="ep_group">Group</label><select id="ep_group" name="group">${groups().map((g) => `<option value="${esc(g.id)}" ${g.id === p.group ? 'selected' : ''}>${esc(g.label)}</option>`).join('')}</select></div>
      <div class="field"><label for="ep_tier">Tier</label><select id="ep_tier" name="tier"><option value="">—</option>${['A', 'B', 'C'].map((t) => sel(p.tier, t)).join('')}</select></div>
      <div class="field"><label for="ep_coach">Primary coach</label><input id="ep_coach" name="coach" type="text" list="coachlist2" value="${esc(p.coach || '')}"></div>
      <div class="field"><label for="ep_coach2">Secondary coach</label><input id="ep_coach2" name="coach2" type="text" list="coachlist2" value="${esc(p.coach2 || '')}"></div>
      <div class="field"><label for="ep_status">Status</label><select id="ep_status" name="status"><option value="active" ${active(p) ? 'selected' : ''}>Active</option><option value="inactive" ${active(p) ? '' : 'selected'}>Inactive</option></select></div></div>
      <datalist id="coachlist2">${coachList().map((c) => `<option value="${esc(c)}">`).join('')}</datalist>
      <div class="rowx"><button class="btn pri" type="submit">Save changes</button><button class="btn ghost" type="button" data-act="toggle-edit">Cancel</button></div></form>`;
  }
  function startCard(t, rec) {
    const d = FORMS[t];
    const parts = multi(d) && rec ? `<div class="pbtns" role="group" aria-label="Go straight to one part"><span class="flbl">Go straight to</span>${d.parts.map((x) => `<button class="pbtn mini" style="--pc:${PILLAR[x.pillar]}" data-act="start" data-type="${t}" data-part="${x.id}"><b>${esc(x.label)}</b></button>`).join('')}</div>` : '';
    return `<div class="start${rec ? ' rec' : ''}${multi(d) && rec ? ' wide' : ''}" style="--pc:${PILLAR[d.pillar]}"><button class="sbtn" data-act="start" data-type="${t}"><b>${esc(d.title)}</b><small>${rec ? 'Suggested for this group · ' : ''}${esc(d.time)}</small></button>${parts}</div>`;
  }
  function tabAssess(p) {
    const g = group(p.group); const rec = p.group === 'camp' ? ['camp_snapshot', 'camp_performance'] : [g.form || 'quarterly_hp', 'monthly'];
    const order = rec.concat(FORM_ORDER.filter((t) => !rec.includes(t)));
    const starts = writable() ? `<div class="sect"><h2>Start or continue an assessment</h2></div><div class="starts">${order.map((t) => startCard(t, rec.includes(t))).join('')}</div>` : '';
    const mine = playerAssess(p.id); const rows = mine.map((a) => rowAssess(a, false, true)).join('');
    return `${starts}<div class="sect"><h2>On file</h2><span class="muted" style="font-size:12px">${mine.filter((a) => a.status === 'final').length} final · ${mine.filter((a) => a.status !== 'final').length} draft</span></div>
      ${rows ? `<div class="list">${rows}</div>` : `<div class="empty">${S.loaded.assess || S.dbState === 'none' ? 'Nothing on file for this player yet.' : 'Loading…'}</div>`}`;
  }

  /* videos */
  const VCATS = ['Forehand', 'Backhand', 'Serve', 'Return', 'Volleys', 'Movement', 'Match Play', 'Fitness', 'Other'];
  function tabVideos(p) {
    const vs = S.pdata.videos.filter((v) => (!S.ui.vfCat || v.category === S.ui.vfCat) && (!S.ui.vfQ || v.quarter === S.ui.vfQ));
    const yr = new Date().getFullYear(); const cmp = S.ui.compare.map((id) => S.pdata.videos.find((v) => v.id === id)).filter(Boolean);
    const card = (v, big) => `<div class="vcard${S.ui.compare.includes(v.id) ? ' sel' : ''}"><div class="rowx" style="justify-content:space-between"><span class="chip tier">${esc(v.category || 'Other')}</span><span class="muted" style="font-size:12px">${esc(v.quarter || '')} ${esc(v.year || '')}</span></div>
      <h3>${esc(v.title || 'Untitled video')}</h3>${v.note ? `<p>${esc(v.note)}</p>` : ''}
      <div class="rowx">${safeUrl(v.url) ? `<a class="btn sm ${big ? 'pri' : ''}" href="${esc(safeUrl(v.url))}" target="_blank" rel="noopener noreferrer">Open video</a>` : '<span class="muted">Invalid link</span>'}
      ${big ? '' : `<button class="btn sm ghost" data-act="cmp" data-id="${esc(v.id)}">${S.ui.compare.includes(v.id) ? 'Remove from compare' : 'Compare'}</button>`}
      ${writable() && !big ? `<button class="btn sm ghost danger" data-act="del-video" data-id="${esc(v.id)}">Delete</button>` : ''}</div></div>`;
    return `${writable() ? `<form class="panel stack" data-form="add-video" data-pid="${esc(p.id)}" style="margin-bottom:20px"><div class="lbl">Add a video</div><div class="grid2">
        <div class="field" style="grid-column:1/-1"><label for="v_url">Google Drive link</label><input id="v_url" name="url" type="url" required placeholder="Paste the Google Drive share link (YouTube works too)"></div>
        <div class="field"><label for="v_title">Title</label><input id="v_title" name="title" type="text" placeholder="e.g. Forehand cross-court drill"></div>
        <div class="field"><label for="v_cat">Category</label><select id="v_cat" name="category">${VCATS.map((c) => `<option>${c}</option>`).join('')}</select></div>
        <div class="field"><label for="v_q">Quarter</label><select id="v_q" name="quarter">${['Q1', 'Q2', 'Q3', 'Q4'].map((q) => `<option ${q === qLabel(new Date()).split(' ')[0] ? 'selected' : ''}>${q}</option>`).join('')}</select></div>
        <div class="field"><label for="v_year">Year</label><select id="v_year" name="year">${[yr - 1, yr, yr + 1].map((y) => `<option ${y === yr ? 'selected' : ''}>${y}</option>`).join('')}</select></div>
        <div class="field" style="grid-column:1/-1"><label for="v_note">Coach note — what to look for</label><input id="v_note" name="note" type="text"></div></div>
        <div class="rowx"><button class="btn pri" type="submit">Save video</button><span class="hint">Videos stay on Google Drive. The portal keeps the link and opens it in a new tab.</span></div></form>` : ''}
      ${cmp.length ? `<div class="sect"><h2>Compare</h2><button class="btn sm ghost" data-act="cmp-clear">Clear</button></div><div class="compare">${cmp.map((v) => card(v, true)).join('')}</div>${cmp.length === 1 ? '<p class="hint" style="margin:-8px 0 18px">Pick a second video, then open both side by side.</p>' : ''}` : ''}
      <div class="filters"><select id="vf_cat" data-act="vf" data-k="vfCat" style="width:auto"><option value="">All categories</option>${VCATS.map((c) => `<option ${S.ui.vfCat === c ? 'selected' : ''}>${c}</option>`).join('')}</select>
        <select id="vf_q" data-act="vf" data-k="vfQ" style="width:auto"><option value="">All quarters</option>${['Q1', 'Q2', 'Q3', 'Q4'].map((q) => `<option ${S.ui.vfQ === q ? 'selected' : ''}>${q}</option>`).join('')}</select></div>
      ${vs.length ? `<div class="cards">${vs.map((v) => card(v, false)).join('')}</div>` : '<div class="empty">No videos yet. Record the forehand, backhand and serve each quarter, upload to Google Drive and paste the link here to track the change over time.</div>'}`;
  }

  /* journal */
  function tabJournal(p) {
    const g = S.pdata.goals || {}; const w = writable();
    const entry = (e) => `<div class="jentry ${e.kind === 'coach' ? 'coach' : 'player'}"><div class="rowx" style="justify-content:space-between"><span class="chip tier">${e.kind === 'coach' ? 'Coach entry' : 'Player entry'}${e.by ? ' · ' + esc(e.by) : ''}</span><span class="muted" style="font-size:12px">${esc(fmtISO(e.date))}</span></div>
      <dl>${[['feeling', 'How they’re feeling'], ['working', 'Working on'], ['tournament', 'Tournament reflection'], ['proud', 'Proud of']].filter(([k]) => has(e[k])).map(([k, t]) => `<div><dt>${t}</dt><dd>${esc(e[k])}</dd></div>`).join('')}</dl>
      ${(e.comments || []).map((c) => `<div class="cmt"><b>${esc(c.by || 'Coach')}</b> · <span class="muted">${esc(fmtDate(c.at))}</span><br>${esc(c.text)}</div>`).join('')}
      ${w ? `<form class="rowx" data-form="comment" data-id="${esc(e.id)}"><input name="text" id="c_${esc(e.id)}" type="text" placeholder="Coach comment" aria-label="Coach comment" style="flex:1 1 220px" required><button class="btn sm" type="submit">Comment</button><button class="btn sm ghost danger" type="button" data-act="del-entry" data-id="${esc(e.id)}">Delete</button></form>` : ''}</div>`;
    return `<div class="notice">Private to player and coaching staff. Journal entries never appear in a parent PDF.</div>
      <form class="panel stack" data-form="goals" data-pid="${esc(p.id)}" style="margin-bottom:20px"><div class="lbl">Player goals</div><div class="grid2">
        <div class="field"><label for="g_short">Short-term goal (6–12 weeks)</label><textarea id="g_short" name="short" rows="2" ${w ? '' : 'readonly'}>${esc(g.short || '')}</textarea></div>
        <div class="field"><label for="g_long">Long-term goal (6–12 months)</label><textarea id="g_long" name="long" rows="2" ${w ? '' : 'readonly'}>${esc(g.long || '')}</textarea></div></div>
        ${w ? `<div class="rowx"><button class="btn" type="submit">Save goals</button>${g.updatedAt ? `<span class="hint">Updated ${esc(fmtDate(g.updatedAt))}</span>` : ''}</div>` : ''}</form>
      ${w ? `<form class="panel stack" data-form="add-entry" data-pid="${esc(p.id)}" style="margin-bottom:20px"><div class="lbl">New entry</div><div class="grid2">
        <div class="field"><label for="j_kind">Who is writing?</label><select id="j_kind" name="kind"><option value="player">Player</option><option value="coach">Coach</option></select></div>
        <div class="field"><label for="j_by">Name</label><input id="j_by" name="by" type="text" placeholder="Optional"></div>
        <div class="field"><label for="j_date">Date</label><input id="j_date" name="date" type="date" value="${todayISO()}"></div></div>
        <div class="field"><label for="j_feeling">How are you feeling?</label><textarea id="j_feeling" name="feeling" rows="2"></textarea></div>
        <div class="field"><label for="j_working">What are you working on?</label><textarea id="j_working" name="working" rows="2"></textarea></div>
        <div class="field"><label for="j_tournament">Tournament reflection</label><textarea id="j_tournament" name="tournament" rows="2"></textarea></div>
        <div class="field"><label for="j_proud">What are you proud of?</label><textarea id="j_proud" name="proud" rows="2"></textarea></div>
        <div class="rowx"><button class="btn pri" type="submit">Save entry</button></div></form>` : ''}
      <div class="stack">${S.pdata.journal.length ? S.pdata.journal.map(entry).join('') : '<div class="empty">No journal entries yet.</div>'}</div>`;
  }

  /* ───────────── editor: one assessment, filled in by part ───────────── */
  const curPart = () => partsOf(E.def).find((x) => x.id === E.part) || partsOf(E.def)[0];
  const partIdx = (part) => part.sections.map((sid) => E.def.sections.findIndex((s) => s.id === sid)).filter((i) => i >= 0);
  const partInfo = (pid) => (E.head.parts && E.head.parts[pid]) || {};
  const isLocked = () => multi(E.def) && !!partInfo(E.part).done;
