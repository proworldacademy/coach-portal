  /* ───────────── try-outs: prospective players coming for a session ─────────────
     A try-out is a child who is not on the roster yet. The front desk or a director books it; the coaches see it on the
     home screen the moment they open the portal: who, when, which group, who runs it, and what is still missing. Every
     step before and after the session is a tick with a name and a date on it, so nothing depends on memory. */
  const TRY_CHECKS = [
    { id: 'contacted', label: 'Parents contacted', hint: 'First conversation done: who they are, what they are looking for, current level.' },
    { id: 'confirmed', label: 'Date and time confirmed with the family', hint: 'They have the day, the time, where to park and what to bring.' },
    { id: 'director', label: 'Introduced to the director', hint: 'The family knows who runs the group and has spoken to them.' },
    { id: 'forms', label: 'Registration form and waiver received', hint: 'Signed waiver, medical notes, emergency contact.' },
    { id: 'coach', label: 'Coach assigned and briefed', hint: 'Who runs the session, and what to look at.' },
  ];
  const TRY_AFTER = [
    { id: 'feedback', label: 'Feedback given to the family', hint: 'Same day if possible: what we saw, what we recommend.' },
    { id: 'decision', label: 'Decision communicated', hint: 'A place offered, waitlist, or not the right fit — and the next step.' },
  ];
  const TRY_INFO = [['name', 'player name'], ['born', 'birth year'], ['group', 'group'], ['date', 'date'], ['time', 'time'], ['parent', 'parent name'], ['phone', 'phone']];
  const TRY_SOURCES = ['Referral', 'Website', 'Instagram', 'Tournament', 'Walk-in', 'School', 'Other'];
  const TRY_OUTCOMES = [['', '—'], ['offered', 'Place offered'], ['joined', 'Joined'], ['waitlist', 'Waitlist'], ['not-fit', 'Not the right fit'], ['declined', 'Family declined']];
  const TRY_STATUS = { planned: 'Planned', came: 'Came', 'no-show': 'No-show', cancelled: 'Cancelled' };
  const tryMissing = (t) => TRY_INFO.filter(([k]) => !has(t[k])).map(([, l]) => l);
  const tryCheck = (t, id) => !!(t && t.checks && t.checks[id] && t.checks[id].done);
  const tryOpen = (t) => TRY_CHECKS.filter((c) => !tryCheck(t, c.id));
  const tryStatus = (t) => (t && TRY_STATUS[t.status] ? t.status : 'planned');
  const tryDone = (t) => tryStatus(t) === 'no-show' || tryStatus(t) === 'cancelled' || (tryStatus(t) === 'came' && tryCheck(t, 'decision'));
  const timeLabel = (hhmm) => { const p = String(hhmm || '').split(':'); const h = +p[0], m = +p[1]; if (isNaN(h)) return String(hhmm || ''); return `${((h + 11) % 12) + 1}:${String(isNaN(m) ? 0 : m).padStart(2, '0')} ${h >= 12 ? 'PM' : 'AM'}`; };
  const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const tryWhen = (t) => (t.date ? `${t.date === todayISO() ? 'Today' : dayLabel(t.date)}${t.time ? ' · ' + timeLabel(t.time) : ''}` : 'No date yet');
  const tryGroupLabel = (t) => (t.group ? group(t.group).label : '');
  const trySorted = () => S.tryouts.slice().sort((a, b) => String(a.date || '9999').localeCompare(String(b.date || '9999')) || String(a.time || '').localeCompare(String(b.time || '')) || String(a.name || '').localeCompare(String(b.name || '')));
  function tryouts() {
    const list = trySorted(); const today = todayISO(), week = addDays(today, 7);
    const planned = list.filter((t) => tryStatus(t) === 'planned');
    return {
      today: planned.filter((t) => t.date === today),
      week: planned.filter((t) => t.date > today && t.date <= week),
      later: planned.filter((t) => !t.date || t.date > week),
      result: planned.filter((t) => !!t.date && t.date < today),
      followup: list.filter((t) => tryStatus(t) === 'came' && !tryCheck(t, 'decision')),
      done: list.filter(tryDone).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)).slice(0, 30),
    };
  }
  // what a coach needs to know at a glance: the first things still open on this try-out
  function tryChips(t, max) {
    const out = []; const st = tryStatus(t);
    if (st === 'planned' && t.date && t.date < todayISO()) out.push('<span class="chip warn">How did it go?</span>');
    if (st === 'came' && !tryCheck(t, 'decision')) out.push(`<span class="chip warn">${tryCheck(t, 'feedback') ? 'Decision pending' : 'Feedback pending'}</span>`);
    if (st === 'no-show' || st === 'cancelled') out.push(`<span class="chip">${TRY_STATUS[st]}</span>`);
    if (st === 'came' && tryCheck(t, 'decision')) out.push(`<span class="chip sent">${(TRY_OUTCOMES.find((o) => o[0] === t.outcome) || ['', 'Done'])[1]}</span>`);
    if (st === 'planned') {
      const miss = tryMissing(t); if (miss.length) out.push(`<span class="chip warn">Missing: ${esc(miss.slice(0, 2).join(', '))}${miss.length > 2 ? ` +${miss.length - 2}` : ''}</span>`);
      const open = tryOpen(t); const short = { contacted: 'Parents not contacted', confirmed: 'Not confirmed', director: 'Meet the director', forms: 'Forms missing', coach: 'No coach' };
      open.forEach((c) => out.push(`<span class="chip warn">${short[c.id]}</span>`));
      if (!miss.length && !open.length) out.push('<span class="chip sent">Ready</span>');
    }
    const lim = max || 3; return out.length > lim ? out.slice(0, lim).join('') + `<span class="chip">+${out.length - lim}</span>` : out.join('');
  }
  function rowTry(t) {
    const who = `<div class="who"><span class="ava when">${esc(t.date ? (t.date === todayISO() ? 'Today' : dayLabel(t.date)) : 'No date')}${t.time ? `<small>${esc(timeLabel(t.time))}</small>` : ''}</span><div style="min-width:0"><div class="nm">${esc(t.name || 'Unnamed')}</div><small>${esc([t.born ? 'Born ' + t.born : '', tryGroupLabel(t), t.coach ? 'Coach ' + t.coach : ''].filter(Boolean).join(' · ') || 'Details to add')}</small></div></div>`;
    return `<button class="rowb" ${goAttr({ view: 'tryout', id: t.id })}>${who}<div class="mid muted" style="font-size:12px">${esc(t.parent ? t.parent + (t.phone ? ' · ' + t.phone : '') : '')}</div><div class="chips">${tryChips(t)}</div></button>`;
  }
  // the block on the home screen: today, the next seven days, and anything waiting for a result
  function homeTryouts() {
    if (!S.loaded.tryouts && S.dbState !== 'none') return '';
    const ty = tryouts(); const show = ty.today.concat(ty.week, ty.result, ty.followup); const more = ty.later.length;
    const title = ty.today.length ? `${ty.today.length} today` : ty.week.length ? `${ty.week.length} this week` : ty.result.length + ty.followup.length ? 'waiting for a result' : more ? `${more} coming up` : 'none booked';
    return `<div class="sect wrapb"><h2>Try-outs · ${esc(title)}</h2><div class="rowx" style="gap:6px">${writable() ? `<button class="btn sm" ${goAttr({ view: 'tryouts', add: 1 })}>Add a try-out</button>` : ''}<button class="btn sm ghost" ${goAttr({ view: 'tryouts' })}>All try-outs</button></div></div>
      ${show.length ? `<div class="list" style="margin-bottom:34px">${show.map(rowTry).join('')}</div>` : `<div class="empty" style="margin-bottom:34px;padding:16px 20px">${more ? `Nothing in the next seven days. ${more} booked later on.` : 'No try-outs booked. When a family books a session, add it here so every coach sees it.'}</div>`}`;
  }
  const tryForm = (t) => {
    const v = (k) => esc((t && t[k]) || ''); const isEdit = !!t;
    return `<form class="panel stack" data-form="${isEdit ? 'edit-tryout' : 'add-tryout'}" ${isEdit ? `data-id="${esc(t.id)}"` : ''} style="margin-bottom:18px">
      <div class="grid2">
        <div class="field"><label for="ty_name">Player name</label><input id="ty_name" name="name" type="text" required autocomplete="off" value="${v('name')}" placeholder="First name + last name"></div>
        <div class="field"><label for="ty_born">Birth year</label><input id="ty_born" name="born" type="number" inputmode="numeric" min="2000" max="2025" value="${v('born')}" placeholder="2014"></div>
        <div class="field"><label for="ty_group">Group to try</label><select id="ty_group" name="group"><option value="">—</option>${groups().map((g) => `<option value="${esc(g.id)}" ${t && t.group === g.id ? 'selected' : ''}>${esc(g.label)}</option>`).join('')}</select></div>
        <div class="field"><label for="ty_coach">Coach running it</label><input id="ty_coach" name="coach" type="text" list="coachlist" autocomplete="off" value="${v('coach')}"></div>
        <div class="field"><label for="ty_date">Date</label><input id="ty_date" name="date" type="date" value="${v('date')}"></div>
        <div class="field"><label for="ty_time">Time</label><input id="ty_time" name="time" type="time" value="${v('time')}"></div>
        <div class="field"><label for="ty_parent">Parent name</label><input id="ty_parent" name="parent" type="text" autocomplete="off" value="${v('parent')}"></div>
        <div class="field"><label for="ty_phone">Parent phone</label><input id="ty_phone" name="phone" type="tel" autocomplete="off" value="${v('phone')}"></div>
        <div class="field"><label for="ty_email">Parent email</label><input id="ty_email" name="email" type="email" autocomplete="off" value="${v('email')}"></div>
        <div class="field"><label for="ty_level">Level</label><input id="ty_level" name="level" type="text" autocomplete="off" value="${v('level')}" placeholder="UTR, years playing, current club…"></div>
        <div class="field"><label for="ty_source">How they found us</label><select id="ty_source" name="source"><option value="">—</option>${TRY_SOURCES.map((x) => `<option ${t && t.source === x ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
      </div>
      <datalist id="coachlist">${coachList().map((c) => `<option value="${esc(c)}">`).join('')}</datalist>
      <div class="field"><label for="ty_notes">Notes for the coaches</label><textarea id="ty_notes" name="notes" rows="3" placeholder="What the family said, what to look at, anything to know.">${v('notes')}</textarea></div>
      <div class="rowx"><button class="btn pri" type="submit">${isEdit ? 'Save changes' : 'Save try-out'}</button><button class="btn ghost" type="button" data-act="${isEdit ? 'try-edit' : 'toggle-addtry'}">Cancel</button></div></form>`;
  };
  function viewTryouts() {
    if (S.route.add && writable()) { S.ui.addingTry = true; S.route.add = false; }
    const ty = tryouts(); const block = (title, hint, list) => (list.length ? `<div class="sect"><h2>${esc(title)}</h2><span class="muted" style="font-size:12px">${list.length}</span></div>${hint ? `<p class="hint" style="margin:-6px 0 10px">${esc(hint)}</p>` : ''}<div class="list" style="margin-bottom:26px">${list.map(rowTry).join('')}</div>` : '');
    const any = S.tryouts.length;
    return `${crumbs([{ t: 'All groups', r: { view: 'home' } }, { t: 'Try-outs' }])}
      <div class="head"><div><div class="lbl">Prospective players</div><h1 class="title">Try-<em>outs.</em></h1>
      <div class="sub">Every family that books a session, from the first call to the decision. Open one to tick off the steps; the home screen shows what is coming up and what is still missing.</div></div>
        <div class="rowx">${writable() ? '<button class="btn pri" data-act="toggle-addtry">Add a try-out</button>' : ''}</div></div>
      <div id="addtry" ${S.ui.addingTry ? '' : 'hidden'}>${S.ui.addingTry ? tryForm(null) : ''}</div>
      ${block('Today', '', ty.today)}
      ${block('This week', '', ty.week)}
      ${block('Coming up', '', ty.later)}
      ${block('Waiting for a result', 'The date has passed. Open it and say whether the player came.', ty.result)}
      ${block('Feedback and decision pending', 'The player came. Give the family feedback and communicate the decision.', ty.followup)}
      ${block('Recently finished', '', ty.done)}
      ${any ? '' : `<div class="empty">${S.loaded.tryouts || S.dbState === 'none' ? 'No try-outs yet. Add the first one when a family books a session.' : 'Loading…'}</div>`}`;
  }
  function viewTryout(id) {
    const t = S.tryouts.find((x) => x.id === id);
    if (!t) return `${crumbs([{ t: 'All groups', r: { view: 'home' } }, { t: 'Try-outs', r: { view: 'tryouts' } }])}<div class="empty">${S.loaded.tryouts ? 'This try-out is no longer here.' : 'Loading…'}</div>`;
    const w = writable(); const st = tryStatus(t); const miss = tryMissing(t); const late = st === 'planned' && !!t.date && t.date < todayISO();
    // required details say "missing" in the warning colour; optional ones just show a dash
    const kv = (label, val, opts) => { const o = opts || {}; return `<div><span class="lbl">${esc(label)}</span><b${has(val) ? '' : o.opt ? ' class="muted"' : ' class="miss"'}>${has(val) ? (o.href ? `<a href="${esc(o.href)}">${esc(val)}</a>` : esc(val)) : o.opt ? '—' : 'missing'}</b></div>`; };
    const details = S.ui.editingTry === id ? tryForm(t) : `<div class="kv">
        ${kv('When', t.date ? tryWhen(t) : '')}${kv('Group', tryGroupLabel(t))}${kv('Coach', t.coach, { opt: true })}${kv('Born', t.born)}${kv('Level', t.level, { opt: true })}${kv('Parent', t.parent)}${kv('Phone', t.phone, { href: 'tel:' + String(t.phone || '').replace(/[^+\d]/g, '') })}${kv('Email', t.email, { href: 'mailto:' + (t.email || ''), opt: true })}${kv('How they found us', t.source, { opt: true })}
      </div>${has(t.notes) ? `<div class="rtext" style="border:0;padding-top:12px"><div class="lbl">Notes for the coaches</div><p>${esc(t.notes)}</p></div>` : ''}`;
    const tick = (c, done) => (done
      ? `<div class="furow ok"><div><b>${esc(c.label)}</b><div class="hint">Done${done.by ? ' by ' + esc(done.by) : ''}${done.at ? ' · ' + esc(fmtDate(done.at)) : ''}</div></div>${w ? `<button class="btn sm ghost" data-act="try-uncheck" data-c="${c.id}">Undo</button>` : ''}</div>`
      : `<div class="furow"><div><b>${esc(c.label)}</b><div class="hint">${esc(c.hint)}</div></div>${w ? `<button class="btn" data-act="try-check" data-c="${c.id}">Done</button>` : ''}</div>`);
    const before = TRY_CHECKS.map((c) => tick(c, tryCheck(t, c.id) ? t.checks[c.id] : null)).join('');
    const after = TRY_AFTER.map((c) => tick(c, tryCheck(t, c.id) ? t.checks[c.id] : null)).join('');
    const statusBtns = w ? `<div class="rowx">${st === 'planned' ? `<button class="btn pri" data-act="try-status" data-v="came">Came</button><button class="btn" data-act="try-status" data-v="no-show">No-show</button><button class="btn ghost" data-act="try-status" data-v="cancelled">Cancelled</button>` : `<button class="btn ghost" data-act="try-status" data-v="planned">Back to planned</button>`}</div>` : '';
    const session = `<div class="furow${late ? '' : ' calm'}"><div><b>${st === 'planned' ? (late ? 'Did the player come?' : 'The session') : TRY_STATUS[st]}</b><div class="hint">${st === 'planned' ? (late ? 'The date has passed. Record what happened so the family gets an answer.' : 'After the session, record whether the player came.') : st === 'came' ? 'Now give the family feedback and communicate the decision below.' : 'Nothing more to do here unless it gets rebooked.'}</div></div>${statusBtns}</div>`;
    const result = st === 'came' ? `<form class="panel stack" data-form="tryout-result" data-id="${esc(t.id)}"><div class="grid2">
        <div class="field"><label for="tr_outcome">Decision</label><select id="tr_outcome" name="outcome">${TRY_OUTCOMES.map((o) => `<option value="${o[0]}" ${(t.outcome || '') === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}</select></div>
        <div class="field"><label for="tr_grp">Group offered</label><select id="tr_grp" name="joinGroup"><option value="">—</option>${groups().map((g) => `<option value="${esc(g.id)}" ${t.joinGroup === g.id ? 'selected' : ''}>${esc(g.label)}</option>`).join('')}</select></div></div>
        <div class="field"><label for="tr_seen">What we saw</label><textarea id="tr_seen" name="seen" rows="3" placeholder="Level, attitude, what stood out, what we recommend.">${esc(t.seen || '')}</textarea></div>
        <div class="rowx"><button class="btn pri" type="submit">Save result</button></div></form>` : '';
    return `${crumbs([{ t: 'All groups', r: { view: 'home' } }, { t: 'Try-outs', r: { view: 'tryouts' } }, { t: t.name || 'Try-out' }])}
      <div class="head"><div><div class="lbl">Try-out · ${esc(tryGroupLabel(t) || 'group to decide')} · ${esc(tryWhen(t))}</div><h1 class="title">${esc(t.name || 'Unnamed')}</h1>
        <div class="sub">${miss.length ? `<span class="chip warn">Missing: ${esc(miss.join(', '))}</span>` : tryOpen(t).length && st === 'planned' ? `${tryOpen(t).length} step${tryOpen(t).length === 1 ? '' : 's'} still to do before the session.` : st === 'planned' ? 'Everything is ready for the session.' : ''}</div></div>
        <div class="rowx">${w ? `<button class="btn" data-act="try-edit">${S.ui.editingTry === id ? 'Close' : 'Edit details'}</button>` : ''}${w && canDelete() ? '<button class="btn ghost danger" data-act="del-try">Delete</button>' : ''}</div></div>
      <div class="sect"><h2>Details</h2></div>${details}
      <div class="sect" style="margin-top:26px"><h2>Before the session</h2><span class="muted" style="font-size:12px">${TRY_CHECKS.length - tryOpen(t).length} of ${TRY_CHECKS.length}</span></div><div class="follow" role="group" aria-label="Before the session">${before}</div>
      <div class="sect" style="margin-top:26px"><h2>The session</h2></div><div class="follow" role="group" aria-label="The session">${session}</div>
      ${st === 'came' ? `<div class="sect" style="margin-top:26px"><h2>After the session</h2></div><div class="follow" role="group" aria-label="After the session" style="margin-bottom:14px">${after}</div>${result}` : ''}`;
  }
  const tryPatch = async (id, patch) => { try { await S.db.doc('tryouts/' + id).update(Object.assign({ updatedAt: Date.now() }, patch)); } catch (e) { dbFail(e); } };
  const tryName = () => (EDITION === 'web' && WEB.user && WEB.user.displayName) || lsGet('pw_coach') || 'Coach';

})();

</script>
</body></html>
