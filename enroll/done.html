<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<title>Enrolled · ProWorld Academy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23050505'/%3E%3Cpath d='M22 48 30 16h14c7 0 10 4 9 10s-6 10-13 10h-6l-3 12z' fill='%23E2FE78'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/shared/brand.css">
<link rel="stylesheet" href="/shared/design.css">
<style>
/* The thank-you page in the redesign (skin "home"): shared/design.css does the look; the script's classes are styled here. */
main{max-width:820px;padding:30px 0 100px}
h1{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:clamp(60px,12vw,132px);line-height:.86;letter-spacing:-.005em;margin:0}
h1 em{font-style:inherit;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.lead{font-size:18px;margin:18px 0 0;max-width:60ch;color:var(--ink-2);line-height:1.5}
.lead b{color:var(--ink);background:linear-gradient(var(--lime),var(--lime)) no-repeat 0 62%/100% 48%;padding:0 3px}
.facts{list-style:none;padding:0;margin:28px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.facts{grid-template-columns:1fr}}
.facts li{background:var(--card);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(12px);padding:14px 16px;font-size:14px;color:var(--ink)}
.facts li b{display:block;font-family:var(--body);font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;font-weight:700}
.facts li:first-child{font-family:var(--display);font-style:italic;font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.facts li.ok{background:var(--mint);border-color:transparent}
.facts li.ok b{color:rgba(0,0,0,.55)}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px;align-items:center}
.note{margin-top:26px;font-size:13.5px;color:var(--muted);max-width:60ch;line-height:1.5}
.foot{margin-top:60px;padding-top:16px;border-top:1px solid var(--line-2);font-size:11.5px;color:var(--muted)}
.spin{width:18px;height:18px;border:2px solid var(--line-2);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body class="skin-home">
<div class="wrap">
<div class="pwd-top" id="pwd-top"></div>
<main id="app"><p class="lead"><span class="spin"></span>One moment — confirming with Stripe…</p></main>
</div>
<script src="/shared/design.js"></script>
<script>window.PWDesign.mount({skin:"home",strip:false,jump:false,title:"Enrolled"});</script>
<script>
(function(){
'use strict';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cents=c=>'$'+(c/100).toLocaleString('en-US',{minimumFractionDigits:c%100?2:0,maximumFractionDigits:2});
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const nice=d=>{if(!d)return '';const [y,m,dd]=d.split('-').map(Number);return MONTHS[m-1]+' '+dd+(y!==new Date().getFullYear()?', '+y:'')};
const q=new URLSearchParams(location.search);const app=document.getElementById('app');
function footer(){return `<footer class="foot">ProWorld Academy · 651 Egret Cir, Delray Beach, FL 33444 · (561) 403-0008 · info@proworldacademy.com</footer>`}
if(q.get('trial')){app.innerHTML=`<h1>See you <em>soon.</em></h1><p class="lead">${esc(q.get('p')||'Your player')} is booked for a free trial session. The front desk will text you to confirm the day and time (soccer trains Tue/Thu 5:00 PM and Sat 9:00 AM) — nothing was charged.</p><div class="actions"><a class="btn ghost" href="/enroll">Enroll another player</a><a class="btn" href="https://proworldacademy.com">proworldacademy.com</a></div>${footer()}`;return}
const s=q.get('s');
if(!s){app.innerHTML=`<h1>Enroll.</h1><p class="lead">Nothing to confirm here — start from the enrollment page.</p><div class="actions"><a class="btn lime" href="/enroll">Go to enrollment</a></div>${footer()}`;return}
let tries=0;
function show(){
  fetch('/api/checkout/status?s='+encodeURIComponent(s),{cache:'no-store'}).then(r=>r.json()).then(st=>{
    if(st.error)throw new Error(st.message);
    if(st.status!=='complete'&&tries++<6){setTimeout(show,2000);return}
    if(st.status!=='complete'){app.innerHTML=`<h1>Not <em>finished.</em></h1><p class="lead">The payment page was closed before the payment went through. Nothing was charged — you can start again, or call the front desk at (561) 403-0008.</p><div class="actions"><a class="btn lime" href="/enroll">Back to enrollment</a></div>${footer()}`;return}
    const en=st.enrollment;const first=(st.player||'Your player').split(' ')[0];
    let facts=`<li><b>Paid today</b>${cents(st.paid||0)}</li>`;
    if(en){facts+=`<li><b>Program</b>${esc(en.program)}${en.plan?' · '+esc(en.plan):''}${en.days&&en.days.length?' · '+en.days.join(', '):''}</li>`;if(en.start)facts+=`<li><b>First day</b>${esc(nice(en.start))}</li>`;if(en.next)facts+=`<li><b>Next charge</b>${en.next.cents===0?'No charge on '+esc(nice(en.next.date))+' (school break)':cents(en.next.cents)+' on '+esc(nice(en.next.date))}</li>`;if(en.pending)facts+=`<li><b>Monthly plan</b>Being set up on your saved card — it bills on the 1st. The front desk confirms if anything needs attention.</li>`}
    else for(const l of (st.lines||[]))if(l.cents)facts+=`<li><b>Item</b>${esc(l.label)} · ${cents(l.cents)}</li>`;
    facts+=`<li class="ok"><b>Receipt</b>Sent by Stripe to ${esc(st.email||'your email')}</li><li class="ok"><b>Roster</b>${esc(first)} is on the roster from day one — the coaches and the front desk have been told${st.roster&&st.roster.player?'':' (if anything looks off, the front desk fixes it in the morning)'}</li>`;
    app.innerHTML=`<h1>${en?'Enrolled.':'Done.'}</h1><p class="lead">${esc(first)} is in${en?' <b>'+esc(en.program)+'</b>':''}. Welcome to ProWorld. Individually built. Fully connected.</p><ul class="facts">${facts}</ul><div class="actions">${st.portalUrl?`<a class="btn lime" href="${esc(st.portalUrl)}">Manage your account</a>`:''}<a class="btn ghost" href="/enroll">Enroll another player</a></div><p class="note">Your account is where you update the card on file, see every invoice${en?', and cancel any time before the 1st (it takes effect at the end of the month already billed)':''}. The link above is for you only; the front desk can send a fresh one any time.</p>${footer()}`;
  }).catch(err=>{app.innerHTML=`<h1>One <em>moment.</em></h1><p class="lead">We couldn't confirm the payment just now (${esc(err.message||'no connection')}). If your card was charged, you're enrolled — the receipt from Stripe is the confirmation. Questions: (561) 403-0008.</p><div class="actions"><a class="btn ghost" href="/enroll">Back to enrollment</a></div>${footer()}`});
}
show();
})();
</script>
</body>
</html>
