<!doctype html>
<html lang="en">
<head>

<link rel="stylesheet" href="/shared/design.css">

<style>
/* PROWORLD — Team (Nov 15, 2026): the team's own messaging, in place of Slack. Channels, direct messages and groups; threads, reactions,
   mentions, mute; the phone gets a notification for every new message in a chat you are in. The chats live in the database
   (teamChats/<id>, its messages under it; teamReads/<e-mail> = what you have read, muted, left) and arrive live. The rules decide who sees
   what: an open channel is the whole team's, everything else only the people in it. The engine (functions/lib/team.js) sends the
   notifications and gives the names of the team. On a computer: the list on the left, the open chat beside it. On a phone: the list,
   then the chat full screen. */
.wrap{max-width:1320px;padding-block:0 0}
body.tc{overflow:hidden}
.tc-app{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;height:calc(var(--tc-h,100dvh) - 72px - env(safe-area-inset-top,0px) - 16px)}
.tc-app.thread{grid-template-columns:300px minmax(0,1fr) 360px}
.tc-side,.tc-main,.tc-thr{background:var(--card-2);border:1px solid var(--line);border-radius:20px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.tc-side h1{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:34px;line-height:.95;margin:0;color:var(--ink)}
.tc-sh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 16px 10px}
.tc-new{width:38px;height:38px;border-radius:50%;border:0;background:var(--pw-inkbg,var(--ink));color:var(--lime);font:700 22px/1 var(--body);cursor:pointer;display:grid;place-items:center}
.tc-q{margin:0 12px 8px;position:relative}
.tc-q input{width:100%;box-sizing:border-box;height:40px;border-radius:12px;border:1px solid var(--line-2);background:var(--pw-sf,#fff);color:var(--ink);padding:0 12px;font:400 14px var(--body)}
.tc-list{overflow-y:auto;padding:0 8px 14px;flex:1;-webkit-overflow-scrolling:touch}
.tc-sec{display:flex;align-items:center;justify-content:space-between;font:700 10.5px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
.tc-row{display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;border:0;background:none;text-align:left;padding:9px 10px;border-radius:12px;cursor:pointer;color:var(--ink-2);font:400 14.5px var(--body);min-height:44px}
.tc-row:hover{background:var(--line)}
.tc-row.on{background:var(--pw-inkbg,var(--ink));color:#fff}
.tc-row .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--line);color:var(--ink);font:700 13px var(--body);flex:0 0 auto}
.tc-row.on .ic{background:var(--lime);color:#0A0A0A}
.tc-row .tx{min-width:0;flex:1;display:block}
.tc-row .tx b{display:block;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:inherit}
.tc-row .tx small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-row.on .tx small{color:rgba(255,255,255,.65)}
.tc-row.un .tx b{font-weight:700;color:var(--ink)}
.tc-row.on.un .tx b{color:#fff}
.tc-row .dot{width:9px;height:9px;border-radius:50%;background:#F06A5E;flex:0 0 auto}
.tc-row .mu{font-size:11px;color:var(--muted)}
.tc-row .join{font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line-2);border-radius:999px;padding:5px 9px;color:var(--ink)}
.tc-push{margin:4px 10px 10px;padding:12px;border-radius:14px;background:var(--lime);color:#0A0A0A;font:400 13px/1.4 var(--body)}
.tc-push button{margin-top:8px;border:0;border-radius:999px;background:#0A0A0A;color:var(--lime);font:700 12.5px var(--body);padding:8px 14px;cursor:pointer}
.tc-mh{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);min-height:44px}
.tc-mh .bk{display:none;border:0;background:none;font:700 15px var(--body);color:var(--ink);padding:8px 6px 8px 0;cursor:pointer}
.tc-mh .ti{min-width:0;flex:1;border:0;background:none;text-align:left;cursor:pointer;padding:0;color:var(--ink)}
.tc-mh .ti b{display:block;font:700 16.5px var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-mh .ti small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-ib{border:1px solid var(--line-2);background:none;color:var(--ink);border-radius:999px;font:700 12px var(--body);padding:8px 12px;cursor:pointer;min-height:36px;white-space:nowrap}
.tc-ib:hover{border-color:var(--ink)}
.tc-msgs{flex:1;overflow-y:auto;padding:10px 6px 6px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.tc-day{display:flex;align-items:center;gap:10px;margin:14px 12px 6px;font:700 10.5px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tc-day::before,.tc-day::after{content:"";flex:1;height:1px;background:var(--line)}
.tc-m{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;padding:5px 10px;border-radius:12px;position:relative}
.tc-m:hover,.tc-m.act{background:var(--line)}
.tc-m .av{width:38px;height:38px;border-radius:12px;background:var(--mint);color:#0A0A0A;display:grid;place-items:center;font:700 13px var(--body)}
.tc-m .av.bot{background:var(--lime)}
.tc-m.more{padding-top:1px;padding-bottom:1px}
.tc-m.more .av{visibility:hidden;height:1px}
.tc-m .hd{display:flex;align-items:baseline;gap:8px}
.tc-m .hd b{font:700 14.5px var(--body);color:var(--ink)}
.tc-m .hd time{font-size:11.5px;color:var(--muted)}
.tc-m .bd{font:400 15px/1.45 var(--body);color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.tc-m .bd.gone{color:var(--muted);font-style:italic}
.tc-m .bd a{color:inherit;text-decoration:underline;text-decoration-color:var(--lime);text-decoration-thickness:2px;text-underline-offset:3px}
.tc-m .bd code{font:13px ui-monospace,Menlo,monospace;background:var(--line);border-radius:6px;padding:1px 5px}
.tc-m .bd pre{font:12.5px/1.45 ui-monospace,Menlo,monospace;background:var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.tc-m .bd .at{background:rgba(226,254,120,.75);color:#0A0A0A;border-radius:6px;padding:0 4px;font-weight:700}
.tc-m .ed{font-size:11px;color:var(--muted);margin-left:6px}
.tc-rx{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.tc-rx button{border:1px solid var(--line-2);background:var(--pw-sf,#fff);color:var(--ink);border-radius:999px;font:400 13px var(--body);padding:3px 9px;cursor:pointer;min-height:28px}
.tc-rx button.me{border-color:var(--ink);background:var(--lime);color:#0A0A0A}
.tc-rp{display:inline-flex;align-items:center;gap:6px;margin-top:5px;border:0;background:none;padding:4px 0;font:700 12.5px var(--body);color:var(--ink);cursor:pointer;text-decoration:underline;text-decoration-color:var(--lime);text-decoration-thickness:2px;text-underline-offset:3px}
.tc-acts{position:absolute;right:10px;top:-14px;display:none;gap:2px;background:var(--pw-sf,#fff);border:1px solid var(--line-2);border-radius:12px;padding:3px;box-shadow:0 10px 26px -14px rgba(0,0,0,.5);z-index:3}
.tc-m:hover .tc-acts,.tc-m.act .tc-acts{display:flex}
.tc-acts button{border:0;background:none;border-radius:9px;min-width:34px;height:34px;font:400 15px var(--body);color:var(--ink);cursor:pointer;padding:0 7px}
.tc-acts button:hover{background:var(--line)}
.tc-acts button.t{font:700 12px var(--body)}
.tc-empty{margin:auto;text-align:center;color:var(--muted);font:400 14px/1.5 var(--body);padding:30px;max-width:380px}
.tc-empty b{display:block;font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:30px;color:var(--ink);margin-bottom:6px;line-height:1}
.tc-comp{border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));position:relative}
.tc-comp form{display:flex;align-items:flex-end;gap:8px}
.tc-comp textarea{flex:1;min-height:44px;max-height:160px;resize:none;box-sizing:border-box;border-radius:14px;border:1px solid var(--line-2);background:var(--pw-sf,#fff);color:var(--ink);padding:11px 13px;font:400 16px/1.35 var(--body)}
.tc-comp textarea:focus{outline:2px solid var(--ink);outline-offset:0}
.tc-send{height:44px;min-width:44px;border-radius:14px;border:0;background:var(--pw-inkbg,var(--ink));color:var(--lime);font:700 14px var(--body);padding:0 16px;cursor:pointer}
.tc-send:disabled{opacity:.45;cursor:default}
.tc-joinbar{padding:14px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;font:400 14px var(--body);color:var(--ink-2)}
.tc-sug{position:absolute;left:12px;right:12px;bottom:calc(100% - 4px);background:var(--pw-sf,#fff);border:1px solid var(--line-2);border-radius:14px;box-shadow:0 18px 40px -20px rgba(0,0,0,.55);max-height:220px;overflow:auto;z-index:5;padding:4px}
.tc-sug button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 11px;border-radius:10px;font:400 14px var(--body);color:var(--ink);cursor:pointer}
.tc-sug button.on,.tc-sug button:hover{background:var(--lime);color:#0A0A0A}
.tc-edit{display:grid;gap:6px;margin-top:4px}
.tc-edit textarea{width:100%;box-sizing:border-box;min-height:60px;border-radius:12px;border:1px solid var(--line-2);background:var(--pw-sf,#fff);color:var(--ink);padding:9px 11px;font:400 15px/1.4 var(--body)}
.tc-edit div{display:flex;gap:8px}
.tc-thr .tc-mh b{font:700 15px var(--body)}
/* photos and files (Nov 15) */
.tc-clip{height:44px;width:44px;flex:0 0 auto;border-radius:14px;border:1px solid var(--line-2);background:var(--pw-sf,#fff);color:var(--ink);display:grid;place-items:center;font:400 22px/1 var(--body);cursor:pointer}
.tc-att{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}.tc-att:empty{display:none}
.tc-att span{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:12px;padding:5px 6px 5px 5px;font:400 12.5px var(--body);color:var(--ink);background:var(--pw-sf,#fff);max-width:100%}
.tc-att img{width:40px;height:40px;border-radius:8px;object-fit:cover}.tc-att b{font-weight:400;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc-att button{border:0;background:var(--line);border-radius:50%;width:24px;height:24px;cursor:pointer;color:var(--ink);font:700 12px var(--body)}
.tc-files{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.tc-img{display:block;border:0;padding:0;background:var(--line);border-radius:14px;overflow:hidden;cursor:zoom-in;width:min(340px,100%);max-height:420px}
.tc-img img{display:block;width:100%;height:100%;object-fit:cover}.tc-img img:not([src]){visibility:hidden}
.tc-file{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line-2);background:var(--pw-sf,#fff);color:var(--ink);border-radius:14px;padding:10px 14px;font:700 13.5px var(--body);cursor:pointer;max-width:100%;text-align:left}
.tc-file small{font-weight:400;color:var(--muted);white-space:nowrap}.tc-file b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc-view img{display:block;max-width:100%;max-height:70dvh;margin:0 auto 12px;border-radius:14px}
/* calls */
.tc-callb{border:1px solid var(--line-2);background:none;color:var(--ink);border-radius:999px;width:40px;height:36px;font-size:16px;cursor:pointer;flex:0 0 auto}
.tc-callb:hover{border-color:var(--ink)}
.tc-callm{display:inline-flex;align-items:center;gap:12px;margin-top:4px;border:1px solid var(--line-2);border-radius:14px;padding:9px 12px;font:400 14px var(--body);color:var(--ink);background:var(--pw-sf,#fff)}
.tc-callm.live{border-color:#0A0A0A;background:var(--lime);color:#0A0A0A}.tc-callm button{border:0;border-radius:999px;background:#0A0A0A;color:#E2FE78;font:700 12.5px var(--body);padding:8px 14px;cursor:pointer}
.tc-m.hit{animation:tchit 2.4s ease}@keyframes tchit{0%,45%{background:rgba(226,254,120,.9)}100%{background:transparent}}
.tc-row .tx small mark{background:rgba(226,254,120,.9);color:#0A0A0A;border-radius:3px;padding:0 2px}
@media(max-width:760px){.tc-mh .tc-ib{display:none}}
/* the sheets: new message, new channel, the chat's details, the reaction picker */
.tc-veil{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:grid;place-items:center;padding:16px}
.tc-sheet{width:100%;max-width:460px;max-height:86dvh;overflow:auto;background:var(--pw-sf,#fff);color:var(--ink);border:1px solid var(--line-2);border-radius:22px;padding:20px;box-shadow:0 40px 90px -40px rgba(0,0,0,.7)}
.tc-sheet h2{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:28px;line-height:1;margin:0 0 4px}
.tc-sheet p{margin:0 0 12px;color:var(--ink-2);font:400 13.5px/1.5 var(--body)}
.tc-sheet label.f{display:block;font:700 10.5px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:12px 0 5px}
.tc-sheet input[type=text]{width:100%;box-sizing:border-box;height:44px;border-radius:12px;border:1px solid var(--line-2);background:var(--pw-sf,#fff);color:var(--ink);padding:0 12px;font:400 15px var(--body)}
.tc-ppl{display:grid;gap:2px;max-height:260px;overflow:auto;margin-top:4px}
.tc-ppl label,.tc-chk{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:10px;font:400 14.5px var(--body);cursor:pointer;min-height:40px}
.tc-ppl label:hover{background:var(--line)}
.tc-ppl small{color:var(--muted);margin-left:auto;font-size:12px}
.tc-ppl input,.tc-chk input{width:20px;height:20px;accent-color:#0A0A0A;flex:0 0 auto}
.tc-sheet .tc-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.tc-pri{border:0;border-radius:999px;background:var(--pw-inkbg,var(--ink));color:var(--lime);font:700 13.5px var(--body);padding:11px 18px;cursor:pointer;min-height:42px}
.tc-pri:disabled{opacity:.45}
.tc-emo{display:flex;flex-wrap:wrap;gap:6px}
.tc-emo button{width:48px;height:48px;border-radius:14px;border:1px solid var(--line-2);background:none;font-size:22px;cursor:pointer}
.tc-mem{display:flex;align-items:center;gap:10px;padding:7px 2px;font:400 14.5px var(--body)}
.tc-mem i{width:30px;height:30px;border-radius:10px;background:var(--mint);color:#0A0A0A;display:grid;place-items:center;font:700 12px var(--body);font-style:normal}
.tc-mem small{color:var(--muted);margin-left:auto;font-size:12px}
@media(max-width:1100px){.tc-app.thread{grid-template-columns:300px minmax(0,1fr)}.tc-app.thread .tc-main{display:none}}
@media(max-width:760px){
  .tc-app,.tc-app.thread{grid-template-columns:minmax(0,1fr);gap:0;height:calc(var(--tc-h,100dvh) - 60px - env(safe-area-inset-top,0px))}
  .tc-side,.tc-main,.tc-thr{border-radius:18px 18px 0 0;border-bottom:0}
  .tc-app .tc-main,.tc-app .tc-thr{display:none}
  .tc-app.open .tc-side{display:none}.tc-app.open .tc-main{display:flex}
  .tc-app.open.thread .tc-main{display:none}.tc-app.open.thread .tc-thr{display:flex}
  .tc-mh .bk{display:block}
  .tc-acts{right:6px}
  .tc-m:hover{background:none}.tc-m:hover .tc-acts{display:none}.tc-m.act{background:var(--line)}.tc-m.act .tc-acts{display:flex}
  body.tc-open .pw-coachbar{display:none!important}
  body.tc-open{padding-bottom:0!important}
  body.tc:not(.tc-open) .tc-list{padding-bottom:110px}
  body.tc-open .pwd-top{display:none}
  body.tc-open .tc-app{height:calc(var(--tc-h,100dvh) - env(safe-area-inset-top,0px));padding-top:0}
  body.tc-kb .tc-comp{padding-bottom:10px}
  body.tc-open .wrap{padding-top:env(safe-area-inset-top,0px)}
}
</style>
</head>
<body class="skin-coach tc">
<div class="wrap">
  <div class="pwd-top" id="pwd-top"></div>
  <div class="tc-app" id="app" aria-live="off"></div>
</div>
<div id="sheet"></div>
<div class="toast" id="toast" role="status"></div>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let toastT; function toast(m, err) { const t = $("toast"); t.textContent = m; t.className = "toast show" + (err ? " err" : ""); clearTimeout(toastT); toastT = setTimeout(() => (t.className = "toast"), 3200); }
  try { window.PWDesign.mount({ skin: "coach", active: "team", title: "Locker Room" }); } catch (e) { /* the page works without the top bar */ }

  /* ── what the page knows ── */
  const S = { me: "", name: "", ctx: null, fs: null, people: {}, peopleList: [], mine: {}, open: {}, gotMine: false, gotOpen: false, openFromServer: false,
    reads: { r: {}, mute: {}, left: {} }, gotReads: false, cur: "", msgs: [], msgsFor: "", thread: "", tmsgs: [], q: "", act: "", edit: "", sheet: null, sug: null, drafts: {}, push: { can: false, on: null, busy: false }, seeded: false,
    att: {}, fcache: {}, fmeta: {}, idx: {}, results: null, jump: null, calls: {}, gotCalls: false, wantCall: "" };
  const BOT = "proworld@bot"; const WINDOW = 400;
  let unMsgs = null, unThread = null;
  const EMO = ["👍", "❤️", "😂", "🎉", "✅", "👀", "🙏", "🔥"];
  const wide = () => window.innerWidth > 760;
  const initials = (n) => (String(n || "").trim().split(/[\s@._-]+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join("") || "?").toUpperCase();
  const nameOf = (email) => (email === BOT ? "ProWorld" : (S.people[email] && S.people[email].name) || String(email || "").split("@")[0]);
  const firstOf = (email) => nameOf(email).split(/\s+/)[0];
  const chats = () => Object.assign({}, S.open, S.mine);
  const chat = (id) => S.mine[id] || S.open[id] || null;
  const isIn = (c) => !!(c && Array.isArray(c.members) && c.members.includes(S.me));
  const others = (c) => (c.members || []).filter((e) => e !== S.me);
  function titleOf(c) {
    if (!c) return "";
    if (c.kind === "channel") return c.name || "channel";
    if (c.kind === "dm") { const o = others(c)[0]; return o ? nameOf(o) : "You"; }
    return c.name || others(c).map(firstOf).join(", ") || "Group";
  }
  const subOf = (c) => (c.kind === "channel" ? (c.topic || ((c.members || []).length + " in it" + (c.private ? " · private" : ""))) : c.kind === "group" ? (c.members || []).length + " people" : others(c)[0] === BOT ? "Reminders and notices from the system" : (S.people[others(c)[0]] || {}).role || "");
  const kb = (n) => (n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB");
  const isImg = (f) => /^image\/(jpeg|png|gif|webp)$/.test(f.type || "") && f.n === 1;
  const callLive = (id) => { const c = S.calls[id]; return !!(c && c.state === "live" && Date.now() - (c.at || 0) < 4 * 3600 * 1000); };
  const unread = (id) => { const c = S.mine[id]; if (!c || !c.last || !c.last.at || c.last.by === S.me) return false; return c.last.at > (S.reads.r[id] || 0); };
  const hash = (s) => { let a = 5381, b = 52711; for (let i = 0; i < s.length; i++) { const ch = s.charCodeAt(i); a = (a * 33) ^ ch; b = (b * 33) ^ ch; } return (a >>> 0).toString(36) + (b >>> 0).toString(36); };
  const dmId = (a, b) => "dm_" + hash([a, b].sort().join("|"));
  const slug = (n) => String(n || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40);
  const FV = () => firebase.firestore.FieldValue;

  async function api(path, body) {

    } catch (e) { toast("Could not turn notifications on: " + (e && e.message ? e.message : e), true); }
    finally { if (!P) { S.push.busy = false; render(true); } }
  }

  /* ── the first time an owner opens the page: the channels the team used on Slack (audited Nov 15, 2026), with the same purpose.
        Channels quiet for three months were left behind. Open channels marked "everyone" take in each person as they arrive. ── */
  const SEED = [
    { id: "general", topic: "Company-wide announcements and work-based matters", everyone: true },
    { id: "announcements", topic: "Important announcements for the whole team", everyone: true },
    { id: "court-management", topic: "Court reservations and arrangements, tournament courts, the state of the courts", everyone: true },
    { id: "marketing", topic: "Academy updates for social media: players, events, coaches, the facility", everyone: true },
    { id: "maintenance-requests", topic: "Something broken or missing on the grounds: say it here", everyone: true },
    { id: "court-maintenance", topic: "The court contractor's file: defects, photos, dates", who: "leads" },
    { id: "tennis-core", topic: "The tennis directors", private: true, who: "leads" },
    { id: "coach-portal", topic: "The Coach Portal: questions and changes", private: true, who: "leads" },
    { id: "full-time-attendance", topic: "The attendance of every session", private: true, who: "leads" },
    { id: "new-enrollments", topic: "New players, spots released, the weekly contact count. Written by the system.", private: true, who: "leads" },
    { id: "soccer-ballmaster", topic: "Soccer with Ballmasters: try-outs and sign-ups", private: true, who: "leads" },
    { id: "front-desk-alerts", topic: "Enrollments, payments and holds, with the family's details. Written by the system.", private: true, who: "desk" },
    { id: "concierge", topic: "Families the concierge hands over to a person", private: true, who: "desk" }
  ];
  async function seed() {
    if (S.seeded || !S.ctx || !S.ctx.owner || !S.openFromServer || !S.gotMine || Object.keys(S.open).length || Object.keys(S.mine).some((id) => S.mine[id].kind === "channel")) return;
    S.seeded = true;
    let staff = []; try { const snap = await S.fs.collection("staff").get(); staff = snap.docs.map((d) => Object.assign({ email: String(d.id).toLowerCase() }, d.data())).filter((p) => p.active === true); } catch (e) { return; }
    const all = Array.from(new Set(staff.map((p) => p.email).concat([S.me])));
    const leads = Array.from(new Set(staff.filter((p) => p.owner === true || ["admin", "director"].includes(String(p.role || "").toLowerCase())).map((p) => p.email).concat([S.me])));
    const desk = Array.from(new Set(staff.filter((p) => p.owner === true || ["admin", "desk"].includes(String(p.role || "").toLowerCase())).map((p) => p.email).concat([S.me])));
    let n = 0;
    for (const c of SEED) { try { await S.fs.doc("teamChats/" + c.id).set({ kind: "channel", name: c.id, topic: c.topic, private: !!c.private, everyone: !!c.everyone, members: (c.everyone ? all : c.who === "desk" ? desk : leads).slice().sort(), createdBy: S.me, createdAt: Date.now(), seed: "slack-2026-11-15" }); n++; } catch (e) { /* the next one */ } }
    if (n) toast(n + " channels set up from Slack.");
  }
  function autoJoin() {
    if (!S.gotReads || !S.gotOpen) return;
    Object.keys(S.open).forEach((id) => { const c = S.open[id]; if (c.everyone === true && !isIn(c) && !S.reads.left[id] && !autoJoin.done[id]) { autoJoin.done[id] = true; S.fs.doc("teamChats/" + id).update({ members: FV().arrayUnion(S.me) }).catch(() => {}); } });
  }
  autoJoin.done = {};

  /* ── taps and typing ── */
  document.addEventListener("click", (e) => {
    const t = e.target; const el = (sel) => (t.closest ? t.closest(sel) : null); let b;
    if ((b = el("[data-sug]"))) { pickSug(+b.dataset.sug); return; }
    if ((b = el("[data-rx]"))) { react(b.dataset.rx, b.dataset.e); if (S.sheet === "rx") closeSheet(); S.act = ""; return; }
    if ((b = el("[data-thread]"))) { S.act = ""; openThread(b.dataset.thread); return; }
    if ((b = el("[data-hit]"))) { const p = b.dataset.hit.split("|"); S.jump = { chat: p[0], id: p[1], th: p[2] || "" }; S.q = ""; S.results = null; if (S.cur === p[0]) { render(true); } else go(p[0]); return; }
    if ((b = el("[data-att-x]"))) { const p = b.dataset.attX.split("|"); (S.att[p[0]] || []).splice(+p[1], 1); const box = document.querySelector('[data-att="' + p[0] + '"]'); if (box) box.innerHTML = attHtml(p[0]); return; }
    if ((b = el("[data-view]"))) { const fid = b.dataset.view; const meta = S.fmeta[fid] || {}; S.sheet = "view"; $("sheet").innerHTML = '<div class="tc-veil" data-veil><div class="tc-sheet tc-view" role="dialog" aria-modal="true" style="max-width:860px"><img alt="' + esc(meta.name || "") + '"' + (S.fcache[fid] ? ' src="' + S.fcache[fid] + '"' : "") + ' data-file="' + esc(fid) + '"><div class="tc-btns"><button type="button" class="tc-ib" data-get="' + esc(fid) + '">' + (wide() ? "Download" : "Save or share") + '</button><button type="button" class="tc-pri" data-act="sheet-x">Done</button></div></div></div>'; lazy(); return; }
    if ((b = el("[data-get]"))) { saveFile(b.dataset.get); return; }
    if ((b = el("[data-join]"))) { const id = b.dataset.join; if (window.PWCall.active() === id) window.PWCall.join(id); else callSheet(id); return; }
    if ((b = el("[data-callin]"))) { const id = b.dataset.callin; const v = b.dataset.v === "1"; const c = S.calls[id]; closeSheet(); if (c && S.cur !== c.chat) go(c.chat); window.PWCall.join(id, v); return; }
    if ((b = el("[data-open]"))) { S.q = ""; S.results = null; go(b.dataset.open); return; }
    if ((b = el("[data-dm]"))) { openDm(b.dataset.dm); return; }
    if ((b = el("[data-act]"))) { const a = b.dataset.act;
      if (a === "new") sheet("new"); else if (a === "new-chan") sheet("chan"); else if (a === "sheet-x") closeSheet(); else if (a === "info") sheet("info");
      else if (a === "back") go(""); else if (a === "thread-x") { if (unThread) { unThread(); unThread = null; } S.thread = ""; render(true); }
      else if (a === "push-on") pushOn();
      else if (a === "call-a" || a === "call-v") window.PWCall.start(S.cur, a === "call-v" ? "video" : "audio");
      else if (a === "join") S.fs.doc("teamChats/" + S.cur).update({ members: FV().arrayUnion(S.me) }).then(() => { delete S.reads.left[S.cur]; S.fs.doc("teamReads/" + S.me).set({ left: { [S.cur]: false } }, { merge: true }).catch(() => {}); }, (er) => toast("Could not join (" + (er.code || er.message) + ").", true));
      else if (a === "leave") { const id = S.cur; S.fs.doc("teamReads/" + S.me).set({ left: { [id]: true } }, { merge: true }).catch(() => {}); S.reads.left[id] = true; S.fs.doc("teamChats/" + id).update({ members: FV().arrayRemove(S.me) }).then(() => { closeSheet(); go(""); }, (er) => toast("Could not leave (" + (er.code || er.message) + ").", true)); }
      else if (a === "mute") { const id = S.cur; const on = !S.reads.mute[id]; S.reads.mute[id] = on; S.fs.doc("teamReads/" + S.me).set({ mute: { [id]: on } }, { merge: true }).catch(() => {}); sheet("info"); render(true); }
      else if (a === "rx-more") sheet("rx", b.dataset.id);
      else if (a === "edit") { S.edit = b.dataset.id; S.act = ""; render(true); const ta = document.querySelector("[data-edit] textarea"); if (ta) ta.focus(); }
      else if (a === "edit-x") { S.edit = ""; render(true); }
      else if (a === "del") sheet("del", b.dataset.id);
      else if (a === "del-yes") { S.fs.doc("teamChats/" + S.cur + "/messages/" + b.dataset.id).update({ deleted: true, text: "" }).catch((er) => toast("Could not delete (" + (er.code || er.message) + ").", true)); closeSheet(); }
      return; }
    if (t.hasAttribute && t.hasAttribute("data-veil")) { closeSheet(); return; }
    if ((b = el(".tc-m")) && !wide() && !el("a") && !el("form")) { const id = b.dataset.m; S.act = S.act === id ? "" : id; document.querySelectorAll(".tc-m.act").forEach((x) => x.classList.remove("act")); if (S.act) b.classList.add("act"); return; }
  });
  document.addEventListener("submit", (e) => {
    const f = e.target; e.preventDefault();
    if (f.dataset.send) { send(f.dataset.send, f.t.value); return; }
    if (f.dataset.edit) { const id = f.dataset.edit; const v = f.t.value.trim(); if (!v) return; const c = chat(S.cur); const mm = mentionsOf(v, c || {}); S.edit = ""; S.fs.doc("teamChats/" + S.cur + "/messages/" + id).update({ text: v.slice(0, 4000), edited: Date.now(), mentions: mm.mentions }).catch((er) => toast("Not saved (" + (er.code || er.message) + ").", true)); render(true); return; }
    const ticked = (n) => Array.from(f.querySelectorAll('input[name="' + n + '"]:checked')).map((i) => i.value);
    if (f.dataset.f === "new") { const p = ticked("p"); if (!p.length) { toast("Tick at least one person."); return; } openGroup(p, f.name.value.trim()); return; }
    if (f.dataset.f === "chan") { makeChannel(f.name.value, f.topic.value, f.priv.checked, f.everyone.checked, ticked("p")); return; }
    if (f.dataset.f === "topic") { const c = chat(S.cur); if (!c) return; S.fs.doc("teamChats/" + S.cur).update(c.kind === "channel" ? { topic: f.v.value.trim().slice(0, 200) } : { name: f.v.value.trim().slice(0, 60) }).then(() => { toast("Saved."); }, (er) => toast("Not saved (" + (er.code || er.message) + ").", true)); return; }
    if (f.dataset.f === "add") { const p = ticked("p"); if (!p.length) return; S.fs.doc("teamChats/" + S.cur).update({ members: FV().arrayUnion.apply(FV(), p) }).then(() => { toast("Added."); sheet("info"); }, (er) => toast("Could not add (" + (er.code || er.message) + ").", true)); return; }
  });
  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.id === "tcq") { S.q = t.value; searchAll(S.q); render(true); return; }
    if (t.tagName === "TEXTAREA" && t.closest("[data-comp]")) { grow(t); S.drafts[t.closest("[data-comp]").dataset.comp] = t.value; suggest(t); }
    if (t.name === "priv" && t.form) { const ev = t.form.querySelector('input[name="everyone"]'); if (ev && t.checked) ev.checked = false; }
    if (t.name === "everyone" && t.form) { const pv = t.form.querySelector('input[name="priv"]'); if (pv && t.checked) pv.checked = false; }
  });
  document.addEventListener("change", (e) => { const t = e.target; if (t.dataset && t.dataset.pick) { addFiles(t.dataset.pick, t.files).then(() => { t.value = ""; }); } });
  document.addEventListener("paste", (e) => { const t = e.target; const comp = t.closest && t.closest("[data-comp]"); if (!comp || !e.clipboardData) return; const fl = Array.from(e.clipboardData.files || []); if (fl.length) { e.preventDefault(); addFiles(comp.dataset.comp, fl); } });
  document.addEventListener("dragover", (e) => { if (S.cur && e.dataTransfer && Array.from(e.dataTransfer.types || []).includes("Files")) e.preventDefault(); });
  document.addEventListener("drop", (e) => { if (!S.cur || !e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return; e.preventDefault(); const c = chat(S.cur); if (c && isIn(c)) addFiles((S.thread ? "t:" + S.thread : "c:" + S.cur), e.dataTransfer.files); });
  document.addEventListener("pw-call", () => render(true));
  document.addEventListener("keydown", (e) => {
    const t = e.target;
    if (e.key === "Escape") { if (S.sheet) closeSheet(); else if (S.sug) { const box = $("sug-" + S.sug.key); if (box) box.hidden = true; S.sug = null; } else if (S.edit) { S.edit = ""; render(true); } return; }
    if (t.tagName !== "TEXTAREA") return;
    if (S.sug && t.closest("[data-comp]")) {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); const n = S.sug.opts.length; S.sug.i = (S.sug.i + (e.key === "ArrowDown" ? 1 : n - 1)) % n; const box = $("sug-" + S.sug.key); if (box) Array.from(box.children).forEach((c, i) => c.classList.toggle("on", i === S.sug.i)); return; }
      if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); pickSug(S.sug.i); return; }
    }
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && wide()) { const f = t.closest("form"); if (f && (f.dataset.send || f.dataset.edit)) { e.preventDefault(); f.requestSubmit ? f.requestSubmit() : f.dispatchEvent(new Event("submit", { cancelable: true, bubbles: true })); } }
  });
  /* the phone's keyboard: the page is as tall as what is left above it, so the box to write in sits on the keyboard and the last line stays in view */
  const vv = window.visualViewport;
  const fit = () => { const h = vv ? vv.height : window.innerHeight; document.documentElement.style.setProperty("--tc-h", Math.round(h) + "px"); const kb = !!vv && window.innerHeight - vv.height > 120; document.body.classList.toggle("tc-kb", kb); if (vv && (vv.offsetTop || window.scrollY)) window.scrollTo(0, 0); if (kb) { const b = $("msgs"); if (b) b.scrollTop = b.scrollHeight; const tb = $("tmsgs"); if (tb) tb.scrollTop = tb.scrollHeight; } };
  if (vv) { vv.addEventListener("resize", fit); vv.addEventListener("scroll", fit); } window.addEventListener("orientationchange", () => setTimeout(fit, 250)); fit();
  window.addEventListener("hashchange", route);
  window.addEventListener("popstate", route);
  window.addEventListener("resize", () => { document.body.classList.toggle("tc-open", !!S.cur && !wide()); fit(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) markRead(); });

  /* ── start ── */
  $("app").innerHTML = '<aside class="tc-side"><div class="tc-sh"><h1>Locker Room</h1></div></aside><section class="tc-main"><div class="tc-empty"><b>One moment</b>Checking who you are…</div></section>';
  window.PWAuth.start({}).then((c) => {
    S.ctx = c; S.me = String(c.email || "").toLowerCase(); S.name = c.name || S.me; S.fs = window.PWAuth.fs();
    S.people[S.me] = { email: S.me, name: S.name, role: c.owner ? "owner" : (c.rec && c.rec.role) || "team" }; S.peopleList = [S.people[S.me]];
    api("people").then((r) => { (r.people || []).forEach((p) => { S.people[p.email] = p; }); if (!r.people.some((p) => p.email === S.me)) r.people.push(S.people[S.me]); S.peopleList = Object.keys(S.people).map((e) => S.people[e]).sort((a, b) => a.name.localeCompare(b.name)); render(true); }).catch(() => {});
    S.fs.collection("teamChats").where("members", "array-contains", S.me).onSnapshot((snap) => { S.mine = {}; snap.docs.forEach((d) => { S.mine[d.id] = d.data(); }); const first = !S.gotMine; S.gotMine = true; if (first || (S.cur && !chat(S.cur))) route(); else render(true); markRead(); seed(); },
      (e) => { S.gotMine = true; render(); toast("Could not read the chats (" + (e.code || e.message) + ").", true); });
    S.fs.collection("teamChats").where("kind", "==", "channel").where("private", "==", false).onSnapshot((snap) => { S.open = {}; snap.docs.forEach((d) => { S.open[d.id] = d.data(); }); S.gotOpen = true; if (!snap.metadata || !snap.metadata.fromCache) S.openFromServer = true; autoJoin(); seed(); render(true); }, () => { S.gotOpen = true; });
    S.fs.doc("teamReads/" + S.me).onSnapshot((d) => { const x = (d.exists && d.data()) || {}; const local = S.reads.r; S.reads = { r: Object.assign({}, x.r || {}), mute: x.mute || {}, left: x.left || {} }; Object.keys(local).forEach((k) => { if (local[k] > (S.reads.r[k] || 0)) S.reads.r[k] = local[k]; }); S.gotReads = true; autoJoin(); render(true); markRead(); }, () => { S.gotReads = true; });
    window.PWCall.init({ fs: S.fs, me: S.me, name: S.name, api, toast, chatOf: chat, titleOf });
    S.fs.collection("teamCalls").where("members", "array-contains", S.me).where("state", "==", "live").onSnapshot((snap) => { S.calls = {}; snap.docs.forEach((d) => { S.calls[d.id] = d.data(); }); S.gotCalls = true; if (S.wantCall) callSheet(S.wantCall); render(true); }, () => { S.gotCalls = true; });
    pushCheck(); render();
  });
})();
</script>
